<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>所有階段圖解</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="sheet-index">
<header>
  <div class="eyebrow"><a href="index.html">Learn</a></div>
  <h1>所有階段圖解</h1>
</header>
<main>
  <p>每門課的每個階段都有一頁圖解，把那個階段幾課的重點畫在同一頁。學完一個階段先看一次，之後複習或面試前也可以直接從這裡找。</p>
  <div id="sheets"></div>
</main>
<script type="module">
  import { el } from './course.js'
  import { COURSES } from './courses.js'
  const root = document.getElementById('sheets')
  for (const [dir, name] of COURSES) {
    if (!dir) continue
    const { STAGES } = await import(`./${dir}/lab.js`)
    if (!STAGES.some(s => s[2])) continue
    const sec = el('section', 'stage')
    sec.id = dir
    sec.innerHTML = `<h2><a href="${dir}/">${name}</a></h2><ol></ol>`
    for (const [title, list, sheet] of STAGES) {
      if (!sheet) continue
      const [, no, stage] = title.match(/^(階段 \d+)：(.*)$/) ?? [, '', title]
      const range = list.length > 1 ? `第 ${list[0][0]}～${list.at(-1)[0]} 課` : `第 ${list[0][0]} 課`
      const li = el('li')
      li.innerHTML = `<span class="n">${no}</span><a href="${dir}/${sheet}">${stage}</a><span class="tag">${range}</span>`
      sec.querySelector('ol').append(li)
    }
    root.append(sec)
  }
  // 從首頁的「N 張階段圖解」連過來時，畫完再捲到那門課
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView()
</script>
</body>
</html>
