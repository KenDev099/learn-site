# AWS 課的練習環境：一個 Moto server 容器，模擬這門課用到的 AWS API。只綁 127.0.0.1，不連外
name: learn-aws
services:
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    container_name: learn-aws-moto
    ports:
      - 127.0.0.1:4580:5000
    environment:
      MOTO_EC2_LOAD_DEFAULT_AMIS: "false"   # 不預先載入幾千個 AMI：每個模擬帳號省下大量記憶體
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      timeout: 3s
      retries: 30
