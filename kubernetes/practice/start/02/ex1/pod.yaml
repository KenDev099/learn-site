apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  # TODO: labels，app.kubernetes.io/name 是 cafe-api
spec:
  containers:
    - name: api
      image: # TODO: 課程映像 learn-k8s/cafe-api，第 1 版
      # TODO: imagePullPolicy
      # TODO: ports（容器聽的 port）
      # TODO: env，REQUIRE_DB 是 0、APP_ENV 是 dev
      resources:              # 資源需求與上限，第 8 課再細講；練習的每個 Pod 都要有
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
