# 練習 3：一個 Pod 三個容器。主容器 api 已經寫好，補上 volume、init container 與原生 sidecar（要求寫在課程頁）
apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  # TODO: volumes：一個 emptyDir，讓 api 和 sidecar 共用
  # TODO: initContainers：
  #   1. 等 fake-db:5432 連得上才結束的 init container（busybox:1.38.0）
  #   2. 每 5 秒把 /shared/heartbeat 印到 stdout 的原生 sidecar（busybox:1.38.0）
  containers:
    - name: api
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: REQUIRE_DB
          value: "0"
        - name: HEARTBEAT_FILE          # cafe-api 每 2 秒把現在時間寫進這個檔案
          value: /shared/heartbeat
      # TODO: volumeMounts
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 128Mi }
