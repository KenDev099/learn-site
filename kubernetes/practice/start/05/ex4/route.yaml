# 練習 4：把 ingress.yaml.txt 的兩個 Ingress 改寫成 HTTPRoute，掛在 cafe-gw 上
# - 每一條 Ingress 規則都要有對應：主機、路徑、比對方式（Prefix → PathPrefix、Exact → Exact）、後端
# - rewrite-target 改用 URLRewrite filter：/menu 開頭的請求，把 /menu 換成 /
# 可以寫成一個或好幾個 HTTPRoute（用 --- 分開）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
  - name: cafe-gw
