# 練習 3：現在只有 HTTP。加一個 HTTPS listener：
# - 名稱 https、port 443、只接 cafe.test
# - 在 Gateway 解密（TLS 終結），憑證用 setup.sh 建立的 Secret cafe-tls
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cafe-gw
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
