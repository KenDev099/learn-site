# 練習 3：現在 HTTP 直接送到 web。改成：
# - HTTPS（https listener）的 cafe.test → web
# - HTTP（http listener）的 cafe.test 一律 301 轉到 https，不送到任何後端
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - cafe.test
  rules:
  - backendRefs:
    - name: web
      port: 80
