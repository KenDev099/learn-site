# 測試提供的後端，不用改。cafe-api 回應都有 x-instance 標頭（Pod 名稱）；
# 設了 ECHO_NAME 的版本對任何路徑都回 {"name", "host", "path"}，用來看請求被送到哪裡、路徑長什麼樣子
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: cafe-api }
  template:
    metadata:
      labels: { app: cafe-api }
    spec:
      containers:
      - name: app
        image: learn-k8s/cafe-api:v1
        imagePullPolicy: IfNotPresent
        env:
        - { name: REQUIRE_DB, value: "0" }
        - { name: DRAIN_MS, value: "0" }
        ports:
        - { name: http, containerPort: 3000 }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-api
spec:
  selector: { app: cafe-api }
  ports:
  - { port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
      - name: app
        image: learn-k8s/cafe-api:v1
        imagePullPolicy: IfNotPresent
        env:
        - { name: REQUIRE_DB, value: "0" }
        - { name: DRAIN_MS, value: "0" }
        - { name: ECHO_NAME, value: web }
        ports:
        - { name: http, containerPort: 3000 }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
  - { port: 80, targetPort: http }
