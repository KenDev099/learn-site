# migration Job（課程提供，不用改）。deploy.sh 把 __VERSION__ 換成這次的版本再套用，例如 cafe-migrate-v2。
# migration 檔由 deploy.sh 從 migrate/sql/ 建成 ConfigMap cafe-migrate-<版本>，掛在 /migrations。
# 正式專案裡 migration 檔跟著應用程式映像（NestJS 課的 prisma/migrations），Job 用同一個映像跑 prisma migrate deploy；
# 這裡為了不建置映像，用 postgres 映像的 psql 依檔名順序執行，已經跑過的記在 schema_migrations，重跑會略過。
apiVersion: batch/v1
kind: Job
metadata:
  name: cafe-migrate-__VERSION__
  labels:
    app.kubernetes.io/name: cafe
    app.kubernetes.io/instance: cafe
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0                 # migration 失敗就停，交給人看，不要自動重跑（第 10 課）
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe
        app.kubernetes.io/instance: cafe
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70             # postgres 映像裡 postgres 使用者的 UID
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL  # migrator 帳號：可以建表、改表；應用程式用的 cafe_app 不行
              valueFrom:
                secretKeyRef: { name: cafe-secrets, key: DATABASE_URL_MIGRATOR }
          command: [sh, -c]
          args:
            - |
              set -eu
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qc "CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"
              for f in /migrations/*.sql; do
                v=$(basename "$f")
                if ! grep -qvE '^[[:space:]]*(--.*)?$' "$f"; then
                  echo "沒有 SQL，略過：$v"; continue
                fi
                if [ -n "$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM schema_migrations WHERE version = '$v'")" ]; then
                  echo "已套用，略過：$v"; continue
                fi
                echo "套用：$v"
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$f" -c "INSERT INTO schema_migrations (version) VALUES ('$v')"
              done
              echo "migration 完成"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: cafe-migrate-__VERSION__
