apiVersion: v1
kind: Service
metadata:
  name: {{ include "cafe.fullname" . }}-api
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cafe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
