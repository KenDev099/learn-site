# 非機密設定：每個鍵變成 api 的環境變數（機密一律在 Secret cafe-secrets，不進 chart）
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cafe.fullname" . }}-config
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
# worker 的程式（files/worker.mjs）。正式專案裡程式在映像裡，這裡為了不建置映像放在 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cafe.fullname" . }}-worker-script
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
data:
  worker.mjs: |
    {{- .Files.Get "files/worker.mjs" | nindent 4 }}
