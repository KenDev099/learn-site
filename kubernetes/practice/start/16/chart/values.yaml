# 預設值（正式環境）。前一位同事的草稿：在他的電腦上跑得起來，但還沒通過上線檢查
image:
  repository: learn-k8s/cafe-api
  # tag 沒有預設值：部署時用 --set image.tag=<版本> 傳入

replicas: 2

# 連線字串所在的 Secret（由平台或 dev-up.sh 建立）
secretName: cafe-secrets

host: cafe.example.com
gateway:
  name: public
  namespace: gateway-system

# 非機密設定，變成 api 的環境變數
config:
  APP_ENV: production
  LOG_LEVEL: info
  # 同事為了方便直接寫在這裡
  DATABASE_URL: "postgres://cafe_app:change-me@postgres:5432/cafe"

api:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

worker:
  image: node:24.22.2-alpine3.24
  replicas: 2
  jobMs: 2000          # 寄一張收據要多久（模擬）
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
