apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cafe.fullname" . }}-api
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "cafe.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ required "image.tag 是必填：部署時用 --set image.tag=<版本> 傳入" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: REDIS_URL }
          envFrom:
            - configMapRef:
                name: {{ include "cafe.fullname" . }}-config
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
