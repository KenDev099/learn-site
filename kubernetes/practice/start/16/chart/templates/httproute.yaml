# 對外的路由。Gateway 由平台團隊管理（第 5 課），chart 只掛上去
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cafe.fullname" . }}
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "cafe.fullname" . }}-api
          port: 80
