# 練習 3：重寄寄送失敗的收據。程式用結束碼告訴你失敗的種類：
#   2 = 設定錯誤（例如沒設 SMTP_HOST）：重試幾次都一樣，應該立刻放棄
#   1 = 暫時的錯誤（郵件伺服器忙線）：值得重試
# TODO：讓結束碼 2 立刻讓整個 Job 失敗、Pod 被驅逐（節點維護）不算進重試次數，其他失敗最多重試 4 次。
# 映像、指令、環境變數不要改。
apiVersion: batch/v1
kind: Job
metadata:
  name: resend-receipts
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resend-receipts
    spec:
      restartPolicy: OnFailure
      containers:
        - name: resend
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SMTP_HOST
              value: smtp.cafe.internal
          command:
            - sh
            - -c
            - |
              if [ -z "$SMTP_HOST" ]; then
                echo "設定錯誤：沒有設定 SMTP_HOST" >&2
                exit 2
              fi
              echo "連不上 $SMTP_HOST，稍後再試" >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 16Mi
