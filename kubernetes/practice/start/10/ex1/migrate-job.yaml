# 練習 1：v1 的資料庫 migration，做成跑完就結束的 Job。
# 映像 learn-k8s/cafe-migrate:v1 會依序執行還沒跑過的 migration（原始碼在 ../migrate/），讀環境變數 DATABASE_URL 連資料庫。
# namespace 裡已經有 postgres 和 Secret db-migrator（key：DATABASE_URL），由測試建立，你不用寫。
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-v1
spec:
  # TODO 1：失敗只重試 1 次、整個 Job 最多跑 120 秒、結束 600 秒後自動刪除
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-migrate
    spec:
      # TODO 2：Pod 結束後不要原地重啟容器（Job 不能用預設的 Always）
      containers:
        - name: migrate
          image: learn-k8s/cafe-migrate:v1
          imagePullPolicy: IfNotPresent
          # TODO 3：環境變數 DATABASE_URL 從 Secret db-migrator 的 key DATABASE_URL 讀
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
