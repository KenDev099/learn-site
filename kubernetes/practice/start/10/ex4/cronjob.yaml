# 練習 4：每日營收報表。jobTemplate 已經寫好：用 psql 執行 ConfigMap daily-report-sql 裡的 report.sql（測試會從 report.sql 建立這個 ConfigMap）。
# TODO：
#   - 每天台北時間 23:30 執行（schedule 和 timeZone 都要寫）
#   - 上一次還沒跑完時，這一次跳過，不要同時跑兩份
#   - 錯過排程時間（例如控制器剛好在重啟）10 分鐘內仍然補跑，超過就算了
#   - 保留最近 3 個成功、3 個失敗的 Job
# jobTemplate 不要改。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-report
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-report
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: postgres:18.6-alpine3.24
              imagePullPolicy: IfNotPresent
              command: ["psql"]
              args: ["$(DATABASE_URL)", "-v", "ON_ERROR_STOP=1", "-f", "/report/report.sql"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: db-report
                      key: DATABASE_URL
              volumeMounts:
                - name: sql
                  mountPath: /report
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: sql
              configMap:
                name: daily-report-sql
