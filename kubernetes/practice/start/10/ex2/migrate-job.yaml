# 練習 2：migration Job 的範本（不用改）。__VERSION__ 由 deploy.sh 換成要部署的版本，例如 v2 → Job migrate-v2、映像 cafe-migrate:v2
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-__VERSION__
  labels:
    app.kubernetes.io/name: cafe-migrate
    app.kubernetes.io/version: __VERSION__
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: learn-k8s/cafe-migrate:__VERSION__
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
