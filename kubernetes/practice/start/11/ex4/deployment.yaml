# 練習 4：容器的根目錄設成唯讀（readOnlyRootFilesystem: true），被入侵時攻擊者沒辦法改程式或放工具。
# 但 POST /uploads 要把暫存檔寫到 /tmp，現在會回 500（EROFS：read-only file system）。
# TODO：只用 emptyDir 讓 /tmp 可以寫，大小上限 64Mi；不能關掉唯讀。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          securityContext:
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
