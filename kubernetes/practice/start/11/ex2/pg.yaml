# 練習 2：開發與測試用的 PostgreSQL（正式環境用 RDS，課文說明為什麼）。
# 現在是 Deployment＋一個共用的 PVC：副本一多就搶同一顆 RWO 磁碟，Pod 名稱每次重建都不同，也沒有固定的 DNS 名稱。
# 改成 StatefulSet pg：
#   - serviceName: pg，replicas: 1
#   - 用 volumeClaimTemplates（名稱 data、ReadWriteOnce、1Gi）讓每個 Pod 有自己的 PVC，取代下面的 PersistentVolumeClaim pg-data
#   - 磁碟掛載的位置要符合 postgres 18 官方映像的規定（看課文）
# 密碼在 Secret pg-admin 的 key password（測試會用隨機值建立，你不要寫 Secret）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: cafe
            - name: POSTGRES_DB
              value: cafe
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-admin
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "cafe", "-d", "cafe"]
            periodSeconds: 2
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-data
