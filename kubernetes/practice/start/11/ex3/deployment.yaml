# 練習 3：cafe-api 的 DATABASE_URL 現在直接寫死「RDS」的位址，換環境（或換資料庫）就要改 Deployment。
# TODO：主機改成 db（service.yaml 的 Service），其他部分不動。
# 密碼在 Secret cafe-db（測試會建立），以檔案提供（第 6 課）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://cafe@ext-pg.k8s-11-ex3-ext:5432/cafe
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db/password
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          volumeMounts:
            - name: db
              mountPath: /run/secrets/db
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: db
          secret:
            secretName: cafe-db
