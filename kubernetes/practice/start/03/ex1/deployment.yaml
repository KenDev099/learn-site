# 練習 1：cafe-api 的 Deployment
# 要求：apps/v1 的 Deployment，名稱 cafe-api、3 個副本；
#   selector 與 Pod 範本都用 app.kubernetes.io/name=cafe-api、app.kubernetes.io/instance=main；
#   容器名稱 api、映像 learn-k8s/cafe-api:v1（imagePullPolicy: IfNotPresent）、環境變數 REQUIRE_DB=0；
#   requests cpu 50m、memory 64Mi，limits memory 128Mi。
# 下面是第 2 課的 Pod，把它改成 Deployment。
apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  containers:
    - name: api
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      env:
        - name: REQUIRE_DB
          value: "0"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
