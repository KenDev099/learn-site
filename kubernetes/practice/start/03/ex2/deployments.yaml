# 練習 2：正式版（3 份 v1）和 canary（1 份 v2）。
# 套用之後 kubectl get pods -l app.kubernetes.io/name=cafe-api 看起來沒問題，但兩個 Deployment 的 selector 有問題。
# 修好它：兩個 selector 不能選到對方的 Pod；兩邊的 Pod 都要保留 app.kubernetes.io/name: cafe-api（第 4 課的 Service 要靠它同時選到兩邊）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: canary
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
