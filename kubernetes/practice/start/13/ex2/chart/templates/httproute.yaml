apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cafe.fullname" . }}
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "cafe.fullname" . }}
          port: 80
