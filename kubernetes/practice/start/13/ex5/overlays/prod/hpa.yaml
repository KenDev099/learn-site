# prod 才有的 HPA：這個檔案不用改
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cafe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cafe
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
