# base：所有環境共用的 manifest。這個資料夾不用改
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: cafe
    includeSelectors: true
configMapGenerator:
  - name: cafe-config
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
