# TODO 8：labels 用 include "cafe.labels"；hostnames 用 .Values.host；backendRefs 指到這個 chart 的 Service（名稱和 Service 一樣用 cafe.fullname）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cafe.fullname" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  hostnames:
    - cafe.test
  rules:
    - backendRefs:
        - name: cafe
          port: 80
