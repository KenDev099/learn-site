# TODO 3：metadata.labels、Pod 範本的 labels 用 include "cafe.labels"；selector.matchLabels 用 include "cafe.selectorLabels"（注意 nindent 的格數）
# TODO 4：replicas 讀 .Values.replicas
# TODO 5：image 是 "repository:tag"，tag 用 required 檢查，沒給時訊息要提到 image.tag
# TODO 6：resources 用 toYaml 輸出 .Values.resources（注意 nindent 的格數）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cafe.fullname" . }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cafe
  template:
    metadata:
      labels:
        app: cafe
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: learn-k8s/cafe-api:latest
          imagePullPolicy: IfNotPresent
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
