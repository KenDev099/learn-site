# 預設值。每個環境不一樣的東西才放這裡，其餘直接寫在範本裡
image:
  repository: learn-k8s/cafe-api
  # tag 刻意沒有預設值：部署時用 --set image.tag=<版本> 傳入（第 13 課「第一個 chart」）

replicas: 2

# HTTPRoute 的網域與要掛上的 Gateway（第 5 課）
host: cafe.test
gateway:
  name: cafe-gw

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# 容器的環境變數（課程叢集沒有資料庫，所以關掉 REQUIRE_DB）
env:
  REQUIRE_DB: "0"

# 應用程式設定：每個鍵會變成 ConfigMap 的一個鍵，再用 envFrom 變成環境變數
# cafe-api 的 GET /config 會列出所有 CAFE_ 開頭的環境變數
config:
  CAFE_MESSAGE: "welcome"
  CAFE_OPEN_HOURS: "07:00-19:00"
