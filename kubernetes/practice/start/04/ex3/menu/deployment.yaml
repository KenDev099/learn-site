# 菜單服務：用 cafe-api 的映像，GET /products 回傳菜單（套用到 namespace k8s-04-ex3-menu）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: menu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: menu
    spec:
      containers:
        - name: menu
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: REQUIRE_DB
              value: "0"
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
