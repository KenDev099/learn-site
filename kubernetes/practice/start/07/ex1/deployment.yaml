# 練習 1：這個版本的 cafe-api 要 8 秒才開始聽 port（STARTUP_DELAY_MS=8000，模擬載入設定、暖快取）。
# 現在 rollout restart 時，新 Pod 一建立就收到流量，前 8 秒的請求全部失敗。
# TODO：在容器 api 加上 readinessProbe，讓 Pod 真的能回應之後才收流量。
# 其他欄位不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: STARTUP_DELAY_MS
              value: "8000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
