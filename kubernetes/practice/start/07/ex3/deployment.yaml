# 練習 3：cafe-api 連 namespace 裡的 postgres（測試會準備好，你不用寫）。
# /health/ready 會檢查資料庫連不連得上；/health/live 只回答程序還活著。
# 現在兩個 probe 都打 /health/ready：資料庫一斷，所有 Pod 都會被重啟。
# TODO：修正 probe，讓資料庫中斷時 Pod 只是停止收流量（NotReady）、不被重啟；資料庫回來後自動恢復。
# 映像、環境變數（REQUIRE_DB 是預設的開啟、DATABASE_URL）不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://cafe@postgres:5432/cafe
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
