# 練習 2 的測試環境（測試會套用到 k8s-12-ex2-outside，這個檔案不用改）：另一個 namespace 的 echo 服務，代表「cafe-api 不需要連的地方」
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: echo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: echo }
    spec:
      containers:
        - name: echo
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: REQUIRE_DB, value: "0" }
            - { name: ECHO_NAME, value: outside }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: { app.kubernetes.io/name: echo }
  ports:
    - port: 80
      targetPort: 3000
