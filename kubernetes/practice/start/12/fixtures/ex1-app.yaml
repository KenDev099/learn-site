# 練習 1 的測試環境（測試會套用到 k8s-12-ex1，這個檔案不用改）：一個副本的 cafe-api，給 deploy.sh 換版本用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cafe-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cafe-api }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: REQUIRE_DB, value: "0" }
            - { name: DRAIN_MS, value: "0" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
