# 練習 2 的測試環境（測試會套用到 k8s-12-ex2，這個檔案不用改）：cafe-api、postgres、redis，加上一個模擬「被入侵的 Pod」的 attacker。
# 開發用的資料庫：postgres 用 trust 驗證、不設密碼，只給練習用；cafe-api 的 /health/ready 只檢查 TCP 連得上。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres]
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cafe-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cafe-api }
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: "postgres://postgres@postgres:5432/postgres" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 2
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-api
spec:
  selector: { app.kubernetes.io/name: cafe-api }
  ports:
    - port: 3000
---
# 被入侵的 Pod：同一個 namespace、有 node 可以發連線，沒有任何 Service 選到它
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  labels: { app.kubernetes.io/name: attacker }
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: sh
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      command: [sleep, infinity]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
