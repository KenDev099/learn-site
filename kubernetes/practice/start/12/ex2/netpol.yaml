# 練習 2：k8s-12-ex2 的網路規則（測試會套用 fixtures/ex2-app.yaml 的 cafe-api、postgres、redis、attacker，再套用這個檔案）
# 現在只有下面這一條：cafe-api 只收 k8s-tools（代表 Gateway）來的 3000。其他 Pod 之間仍然全部互通，attacker 連得到資料庫。
# TODO 1：預設拒絕：一條選到 namespace 裡每個 Pod 的 NetworkPolicy，Ingress 與 Egress 兩個方向都隔離、沒有任何允許規則
# TODO 2：所有 Pod 都能查 DNS：連到 kube-system 裡 k8s-app: kube-dns 的 Pod，UDP 與 TCP 的 53
# TODO 3：cafe-api 只能連 postgres 的 5432 與 redis 的 6379（在下面這條加 Egress）
# TODO 4：postgres 只收 cafe-api 的 5432；redis 只收 cafe-api 的 6379
# 提示：namespace 都有 kubernetes.io/metadata.name 這個標籤，值就是 namespace 名稱
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cafe-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-tools
      ports:
        - { protocol: TCP, port: 3000 }
