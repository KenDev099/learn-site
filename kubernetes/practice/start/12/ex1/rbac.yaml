# 練習 1：CI 部署帳號 ci-deployer 的權限（測試會套用到 namespace k8s-12-ex1）
# 它要做的事：執行 fixtures/deploy.sh（換映像、加註解、等 rollout 完成）、建立與查看 migration 的 Job。
# TODO 1：在 Role deployer 補齊規則：
#   - deployments：讀取（get、list、watch）與更新（patch、update），不能刪除
#   - replicasets、pods：只能讀取（get、list、watch），看 rollout 進度用
#   - jobs（apiGroup batch）：建立與讀取（create、get、list、watch）
#   不要用 *、不要碰 secrets、不要給 pods/exec
# TODO 2：寫一個 RoleBinding deployer，把 Role deployer 綁給 ServiceAccount ci-deployer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
