# 練習 3：namespace k8s-12-ex3 有 pod-security.kubernetes.io/enforce: restricted（測試建立 namespace 時加上，這個檔案不能改它）。
# 現在套用這個 Deployment 會成功，但 ReplicaSet 建不出任何 Pod：用 kubectl describe rs -n k8s-12-ex3 看 FailedCreate 的原因。
# TODO 1：Pod 層級的 securityContext：runAsNonRoot: true、runAsUser: 1000（映像裡 node 使用者的 UID）、seccompProfile 用 RuntimeDefault
# TODO 2：容器 api 的 securityContext：allowPrivilegeEscalation: false、capabilities 丟掉 ALL、readOnlyRootFilesystem: true
# TODO 3：根目錄唯讀後 POST /uploads 要寫 /tmp：在 /tmp 掛一個 emptyDir（sizeLimit 64Mi，第 11 課）
# 映像、副本數、環境變數、探針不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
