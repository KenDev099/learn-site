# 練習 4（之二）：config-watcher 要讀 ConfigMap cafe-flags（功能開關，測試會建立），所以它需要 token 和權限。
# namespace 裡還有別的 ConfigMap（例如 cafe-menu），它不該讀得到。
# TODO 1：ServiceAccount config-watcher（token 要掛載）
# TODO 2：Role：只能 get、watch 名為 cafe-flags 的 configmaps（resourceNames），不要 list
# TODO 3：RoleBinding 把 Role 綁給 ServiceAccount config-watcher
# TODO 4：下面的 Deployment 改用 ServiceAccount config-watcher
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-watcher
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: watcher
          image: curlimages/curl:8.23.0
          imagePullPolicy: IfNotPresent
          command: [sleep, infinity]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
