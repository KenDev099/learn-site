# 練習 4（之一）：cafe-api 不需要呼叫 Kubernetes API，卻用著 namespace 的 default ServiceAccount，token 自動掛在
# /var/run/secrets/kubernetes.io/serviceaccount/。
# TODO 1：在這個檔案加一個 ServiceAccount cafe-api，設定 automountServiceAccountToken: false
# TODO 2：Deployment 改用這個 ServiceAccount（serviceAccountName）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
