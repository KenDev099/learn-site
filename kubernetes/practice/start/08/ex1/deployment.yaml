# 練習 1：這份 Deployment 照抄了別的團隊的設定，每個 Pod 要 4 顆 CPU、8Gi 記憶體。
# 套用之後 3 個 Pod 全部 Pending，一個都排不上。
# TODO：用 kubectl describe pod 看 Pending 的原因、kubectl describe node 看節點的 Allocatable，
#       然後把 resources 改成 requests cpu 100m／memory 96Mi、limits memory 192Mi。
# replicas、映像與其他欄位不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
