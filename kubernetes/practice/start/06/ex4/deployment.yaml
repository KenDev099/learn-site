# 練習 4：這個 Deployment 套用後，Pod 一直沒有 Running。找出原因、寫進 diagnosis.md，然後修好這個檔案。
# Secret cafe-db 由別人管理（測試會建立），你改不到它，也不要自己寫 Secret 的 YAML。
# PGPASSWORD 是 PostgreSQL 的 client 函式庫（libpq）會直接讀的環境變數，這個服務的資料庫工具只認它。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cafe-db
                  key: db-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
