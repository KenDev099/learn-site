# 練習 1：把寫死在這裡的設定與密碼拿出去
# 1. LOG_LEVEL、FEATURE_LOYALTY、APP_ENV 改成用 envFrom 從 ConfigMap cafe-config 整包注入
# 2. DB_PASSWORD 刪掉：密碼在 Secret cafe-db 的 key password 裡（測試會建立，你不要寫 Secret 的 YAML），
#    把這個 Secret 掛成檔案 /run/secrets/db/password，再設環境變數 DB_PASSWORD_FILE=/run/secrets/db/password
# REQUIRE_DB=0 留著（這課還沒有資料庫）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: LOG_LEVEL
              value: info
            - name: FEATURE_LOYALTY
              value: "true"
            - name: APP_ENV
              value: staging
            - name: DB_PASSWORD
              value: latte-1234
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
