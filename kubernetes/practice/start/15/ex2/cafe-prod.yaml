# 練習 2：Argo CD 的 Application：把 config repo 的 charts/cafe 部署到 prod
# 這份檔案放在 config repo，由 Argo CD 讀取；不用在本機 kubectl apply
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cafe-prod
  namespace: argocd          # Application 物件本身放在 Argo CD 所在的 namespace
spec:
  project: cafe              # 平台團隊建立的 AppProject：限制這個團隊能部署到哪些 namespace
  source:
    repoURL: https://github.com/example-cafe/cafe-config
    path: charts/cafe
    targetRevision: HEAD     # TODO：釘成這次發佈的 tag
    # TODO：helm.valueFiles 用 values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default       # TODO：部署到 cafe-prod
  # TODO：syncPolicy：自動同步、prune、selfHeal；syncOptions 自動建立 namespace、同步時也遵守 ignoreDifferences
  # TODO：ignoreDifferences：Deployment 的 /spec/replicas 交給 HPA
