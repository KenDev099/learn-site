# 練習 3：app repo（cafe-api）的發佈流程
# 現在是「push 型」：CI 拿著正式叢集的憑證直接改叢集。改成 GitOps：
#   build：建置並推送映像，tag 用這次的 commit SHA
#   bump-config：把 config repo 的 values-prod.yaml 的 image.tag 改成這次的 SHA，開 PR
# 工作流程裡不能再有 kubectl、helm upgrade、kubeconfig 或任何叢集憑證
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/example-cafe/cafe-api:latest   # TODO：改用這次的 commit SHA

  # TODO：刪掉這個 job，改寫 bump-config
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::123456789012:role/cafe-prod-deployer
          aws-region: ap-northeast-1
      - run: aws eks update-kubeconfig --name cafe-prod
      - run: kubectl -n cafe-prod set image deployment/cafe-api api=ghcr.io/example-cafe/cafe-api:latest
