# 測試工具：probe（curl）與 loadgen（node），在叢集內發請求
# 固定在 control-plane 節點，drain worker 時不會被一起驅逐。loadgen.mjs 由 cluster.mjs 以 ConfigMap 掛進去
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-tools
  labels:
    learn.tools: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: k8s-tools
spec:
  replicas: 1
  selector:
    matchLabels: { app: probe }
  template:
    metadata:
      labels: { app: probe }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      terminationGracePeriodSeconds: 0
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: k8s-tools
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      terminationGracePeriodSeconds: 0
      containers:
        - name: node
          image: node:24.22.2-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          volumeMounts: [{ name: script, mountPath: /loadgen }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: script
          configMap: { name: loadgen }
