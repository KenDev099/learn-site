# 點餐 API（套用到 namespace k8s-04-ex3-api）：GET /menu-proxy 會去抓 MENU_URL 的內容
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: MENU_URL
              value: "http://menu.k8s-04-ex3-menu/products"
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
