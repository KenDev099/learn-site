# 練習 3：3 個副本的 cafe-api，probe、preStop、寬限期都照第 7 課設好了。
# 測試會在持續流量下 kubectl drain learn-k8s-worker，要求 drain 成功、0 錯誤。
# TODO：在 Pod 範本的 spec 加上 topologySpreadConstraints，讓副本平均分散到各節點：
#   topologyKey kubernetes.io/hostname、maxSkew 1、whenUnsatisfiable DoNotSchedule、
#   labelSelector 選到這個 Deployment 的 Pod、nodeTaintsPolicy Honor
# 另外在 pdb.yaml 寫 PodDisruptionBudget。副本數、映像、label 不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: drain-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: drain-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: drain-lab
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cafe-api
              app.kubernetes.io/instance: drain-lab
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
