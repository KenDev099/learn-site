# 自願中斷（drain、節點升級）時一次最多少 1 個 api Pod。不用 minAvailable：等於最小副本數時 drain 永遠卡住（第 9 課）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cafe.fullname" . }}-api
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
