apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cafe.fullname" . }}-worker
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cafe.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "cafe.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "cafe.podSecurity" . | nindent 8 }}
      # 收到 SIGTERM 後要把手上的 job 做完：寬限期要大於最長的 job（寄信服務逾時 45 秒，再留餘裕）
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: IfNotPresent
          command: [node, /app/worker.mjs]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: REDIS_URL }
            - name: JOB_MS
              value: {{ .Values.worker.jobMs | quote }}
          securityContext:
            {{- include "cafe.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ include "cafe.fullname" . }}-worker-script
