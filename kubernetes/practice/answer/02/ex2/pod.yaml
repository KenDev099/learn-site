# 這份 Pod 有三個錯。先用 kubeconform 和 kubectl apply --dry-run=server 找出來，再一個一個修
apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/part-of: cafe
    team: cafe-api-squad
spec:
  containers:
    - name: api
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: REQUIRE_DB
          value: "0"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
