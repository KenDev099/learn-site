# 練習 2：learn-k8s/cafe-api:slow-start 要 45 秒才開始聽 port（模擬啟動時要載入大量資料的服務）。
# 現在的 livenessProbe 在啟動期間就開始檢查，45 秒還沒到就判定失敗、把容器重啟，永遠起不來（CrashLoopBackOff）。
# TODO 1：加上 startupProbe，讓它最多可以等 60 秒以上才算啟動失敗
# TODO 2：保留 livenessProbe，但啟動之後卡住要能在 20 秒內被發現（initialDelaySeconds 不要拉長）
# TODO 3（選做）：加上 readinessProbe（/health/ready）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:slow-start
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
