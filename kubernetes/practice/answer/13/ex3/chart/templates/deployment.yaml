apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cafe.fullname" . }}
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cafe.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ required "image.tag 是必填：部署時用 --set image.tag=<版本> 傳入" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "cafe.fullname" . }}-config
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
