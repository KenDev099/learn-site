# 練習 3：HTTPS 送到 web；HTTP 只做轉址
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
  - name: cafe-gw
    sectionName: https
  hostnames:
  - cafe.test
  rules:
  - backendRefs:
    - name: web
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-https
spec:
  parentRefs:
  - name: cafe-gw
    sectionName: http
  hostnames:
  - cafe.test
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
