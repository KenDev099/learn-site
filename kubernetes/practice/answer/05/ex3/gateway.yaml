# 練習 3：HTTP 與 HTTPS 兩個 listener，HTTPS 在 Gateway 終結
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cafe-gw
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    hostname: cafe.test
    tls:
      mode: Terminate
      certificateRefs:
      - name: cafe-tls
    allowedRoutes:
      namespaces:
        from: Same
