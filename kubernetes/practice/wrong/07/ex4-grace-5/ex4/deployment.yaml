# 練習 4：這個 cafe-api 設了 DRAIN_MS=0：收到 SIGTERM 立刻停止接新連線，只把手上的請求做完再結束
# （很多框架預設就是這樣）。有些請求很長（GET /slow?ms=4000 要 4 秒）。
# 現在滾動重啟時會有零星的連線錯誤。
# TODO 1：加上 readinessProbe（/health/ready）
# TODO 2：加上 preStop hook，用 sleep 動作等幾秒，讓各節點先把這個 Pod 從轉送規則拿掉
# TODO 3：寫出 terminationGracePeriodSeconds：要容得下 preStop＋最長的請求（4 秒）＋關閉時間（2 秒）
# DRAIN_MS 維持 "0"、映像維持 v1：這題要用 Kubernetes 的設定解決，不是改應用程式。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: DRAIN_MS
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
