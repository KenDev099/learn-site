# 預設值（正式環境）。每個環境不一樣的東西才放這裡；機密一律不放（在 Secret cafe-secrets）
image:
  repository: learn-k8s/cafe-api
  # tag 沒有預設值：部署時用 --set image.tag=<版本> 傳入

# 連線字串所在的 Secret（由平台或 dev-up.sh 建立，chart 只參照名稱）
secretName: cafe-secrets

host: cafe.example.com
gateway:
  name: public
  namespace: gateway-system

# 非機密設定，變成 api 的環境變數
config:
  APP_ENV: production
  LOG_LEVEL: info

api:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 4
  cpuPercent: 70
  scaleDownWindowSeconds: 300

worker:
  image: node:24.22.2-alpine3.24
  replicas: 2
  jobMs: 2000          # 寄一張收據要多久（模擬）
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
