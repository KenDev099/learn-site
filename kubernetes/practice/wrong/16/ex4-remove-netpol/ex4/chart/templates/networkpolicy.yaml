# 2. 每個 Pod 都要能查 DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cafe.fullname" . }}-allow-dns
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 4. worker：沒有人連進來，只連 redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cafe.fullname" . }}-worker
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 5. migration Job：只連 postgres。第一次部署時這些規則還不存在，所以忘了這條要到第二次部署才會卡住
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cafe.fullname" . }}-migrate
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migrate
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { app.kubernetes.io/name: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
