apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cafe.fullname" . }}-api
  labels:
    {{- include "cafe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # 不寫 replicas：副本數交給 HPA，否則每次 helm upgrade 都會把 HPA 擴出來的 Pod 縮回去（第 13 課）
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cafe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cafe.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "cafe.fullname" . }}
      automountServiceAccountToken: false     # api 不呼叫 Kubernetes API，不需要 token
      securityContext:
        {{- include "cafe.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 30       # ≥ preStop 5 秒 + DRAIN_MS 5 秒 + 最長請求
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor             # 不把 control-plane、cordon 中的節點算進來（第 9 課）
          labelSelector:
            matchLabels:
              {{- include "cafe.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ required "image.tag 是必填：部署時用 --set image.tag=<版本> 傳入" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL                 # cafe_app 帳號：只能讀寫資料，不能改表
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: DATABASE_URL }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: REDIS_URL }
          envFrom:
            - configMapRef:
                name: {{ include "cafe.fullname" . }}-config
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:                        # 依賴（資料庫、Redis）連不上時先不要收流量
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5                       # 等其他節點更新轉送規則再開始關機
          securityContext:
            {{- include "cafe.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
