# 錯誤：兩個主機合成一個 HTTPRoute，卻沒寫 hostnames：任何主機都套用全部規則
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe
spec:
  parentRefs:
  - name: cafe-gw
  rules:
  - matches:
    - path: { type: PathPrefix, value: /orders }
    - path: { type: Exact, value: /healthz }
    backendRefs:
    - name: orders
      port: 80
  - matches:
    - path: { type: PathPrefix, value: /menu }
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: menu
      port: 80
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: web
      port: 80
