# 練習 4：一個主機一個 HTTPRoute，方便各自的團隊管理
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - api.cafe.test
  rules:
  - matches:
    - path: { type: Exact, value: /orders }
    - path: { type: Exact, value: /healthz }
    backendRefs:
    - name: orders
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - www.cafe.test
  rules:
  - matches:
    - path: { type: PathPrefix, value: /menu }
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: menu
      port: 80
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: web
      port: 80
