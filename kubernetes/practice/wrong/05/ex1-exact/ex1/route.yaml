# 練習 1：應用團隊的路由
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - cafe.test
  rules:
  - matches:
    - path: { type: PathPrefix, value: /products }
    - path: { type: Exact, value: /orders }
    backendRefs:
    - name: cafe-api
      port: 80
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: web
      port: 80
