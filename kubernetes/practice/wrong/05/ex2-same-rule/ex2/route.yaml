# 錯誤：標頭條件跟權重放在同一個 rule，matches 之間是「或」，帶標頭的請求也照 90:10 分流
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe-api
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - cafe.test
  rules:
  - matches:
    - headers:
      - name: X-Canary
        value: "1"
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: cafe-api-v1
      port: 80
      weight: 90
    - name: cafe-api-v2
      port: 80
      weight: 10
