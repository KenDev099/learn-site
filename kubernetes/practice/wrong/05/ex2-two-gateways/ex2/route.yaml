# 錯誤：自己再開一個 Gateway 給 v2 用
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: canary-gw
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe-api
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - cafe.test
  rules:
  - backendRefs:
    - name: cafe-api-v1
      port: 80
      weight: 90
    - name: cafe-api-v2
      port: 80
      weight: 10
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe-api-canary
spec:
  parentRefs:
  - name: canary-gw
  hostnames:
  - cafe.test
  rules:
  - backendRefs:
    - name: cafe-api-v2
      port: 80
