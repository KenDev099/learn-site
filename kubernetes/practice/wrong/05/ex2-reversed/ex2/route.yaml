# 練習 2：金絲雀
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe-api
spec:
  parentRefs:
  - name: cafe-gw
  hostnames:
  - cafe.test
  rules:
  # 內部測試：帶 X-Canary: 1 的一律到 v2。比對條件比下一條多一個標頭，所以優先
  - matches:
    - headers:
      - name: X-Canary
        value: "1"
    backendRefs:
    - name: cafe-api-v2
      port: 80
  # 其他請求：依權重 90:10 分流
  - backendRefs:
    - name: cafe-api-v1
      port: 80
      weight: 10
    - name: cafe-api-v2
      port: 80
      weight: 90
