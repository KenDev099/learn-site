apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: menu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: menu
    spec:
      containers:
        - name: menu
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: REQUIRE_DB
              value: "0"
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: menu
spec:
  selector:
    app.kubernetes.io/name: menu
  ports:
    - name: http
      port: 80
      targetPort: http
