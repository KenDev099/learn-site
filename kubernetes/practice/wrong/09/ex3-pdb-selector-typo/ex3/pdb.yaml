# 練習 3：PodDisruptionBudget（policy/v1）
# TODO：名稱 cafe-api，selector 選到 Deployment 的 Pod，自願中斷時最多只能少 1 個（maxUnavailable: 1）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cafe-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: drainlab
