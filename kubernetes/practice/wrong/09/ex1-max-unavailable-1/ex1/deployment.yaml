# 練習 1：4 個副本的 cafe-api。啟動要 3 秒（STARTUP_DELAY_MS），preStop 與寬限期已經照第 7 課設好。
# 測試會在持續流量下把映像從 v1 換成 v2，要求全程 0 錯誤、可用的 Pod 永遠不少於 4 個。
# TODO 1：加上 readinessProbe（第 7 課）：HTTP GET /health/ready，periodSeconds 不超過 5
# TODO 2：寫出 strategy：RollingUpdate，更新期間可用的 Pod 不能少於 4 個（想想 maxSurge 和 maxUnavailable 各該是多少）
# TODO 3：minReadySeconds: 5（新 Pod Ready 後要穩定 5 秒才算可用）
# 映像、副本數、環境變數不要改。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  replicas: 4
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
      app.kubernetes.io/instance: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
        app.kubernetes.io/instance: main
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: STARTUP_DELAY_MS
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
