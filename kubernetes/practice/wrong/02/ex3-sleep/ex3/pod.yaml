apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  volumes:
    - name: shared
      emptyDir: {}
  initContainers:
    - name: wait-db
      image: busybox:1.38.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "30"]
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits: { memory: 16Mi }
    - name: heartbeat
      image: busybox:1.38.0
      imagePullPolicy: IfNotPresent
      restartPolicy: Always
      command: ["sh", "-c", "while true; do cat /shared/heartbeat 2>/dev/null; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits: { memory: 16Mi }
  containers:
    - name: api
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: REQUIRE_DB
          value: "0"
        - name: HEARTBEAT_FILE
          value: /shared/heartbeat
      volumeMounts:
        - name: shared
          mountPath: /shared
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 128Mi }
