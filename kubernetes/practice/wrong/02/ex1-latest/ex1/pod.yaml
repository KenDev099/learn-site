apiVersion: v1
kind: Pod
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  containers:
    - name: api
      image: learn-k8s/cafe-api:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: REQUIRE_DB
          value: "0"
        - name: APP_ENV
          value: dev
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
