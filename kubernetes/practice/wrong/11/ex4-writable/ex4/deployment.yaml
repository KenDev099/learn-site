apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
