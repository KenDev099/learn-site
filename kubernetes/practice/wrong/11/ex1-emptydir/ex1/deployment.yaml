# 練習 1：收據服務。POST /receipts 會把收據寫成 /data/<id>.json，GET /receipts 列出 /data 裡的收據。
# 現在 /data 是 emptyDir：Pod 一被刪掉（節點維護、kubectl delete pod、換版），收據就全部不見。
# TODO 1：/data 改掛 PVC receipts-data（pvc.yaml）
# TODO 2：更新策略改成適合「單一 ReadWriteOnce 磁碟」的那一種，replicas 維持 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          volumeMounts:
            - name: receipts
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: receipts
          emptyDir: {}
