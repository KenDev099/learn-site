# 練習 5：cafe-api 要依 CPU 用量自動擴展（2～5 個副本）。
# TODO 1：容器加上 CPU requests（100m）：HPA 的使用率是「實際用量 ÷ requests」
# TODO 2：HPA 接手之後，副本數由 HPA 決定：把 spec.replicas 從這個檔案移除
# 其他欄位不要改；HPA 寫在 hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
