# 練習 2：產生日報表的請求（POST /alloc?mb=150）要暫時用到 150MB 記憶體，
# 每次一打這個請求，容器就被殺掉重啟，請求也拿不到回應。
# TODO 1：先重現一次，在 work/08/ex2-diagnosis.json 寫下容器上次結束的 reason 與 exitCode
# TODO 2：把 limits.memory 調大到處理得了這個請求（記憶體預算：最多 512Mi）
# TODO 3：加上環境變數 NODE_OPTIONS，用 --max-old-space-size=<MB> 把 V8 heap 上限設在 limit 的 80% 以下
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: NODE_OPTIONS
              value: --max-old-space-size=192
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
