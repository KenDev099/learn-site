# 練習 3：符合 Pod Security restricted 的 cafe-api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-api
  labels:
    app.kubernetes.io/name: cafe-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe-api
    spec:
      securityContext:
        runAsNonRoot: true          # 映像或 runAsUser 是 root 時，kubelet 拒絕啟動容器
        runAsUser: 0                # node 映像裡 node 使用者的 UID
        seccompProfile:
          type: RuntimeDefault      # 用容器執行環境預設的系統呼叫過濾
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false   # 不能透過 setuid 程式變成 root
            capabilities:
              drop: [ALL]                     # 3000 port 不需要任何 capability
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
