# 練習 1：CI 部署帳號 ci-deployer 的權限（測試會套用到 namespace k8s-12-ex1）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
rules:
  # 換版本：讀取並更新 Deployment，沒有 delete
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch, update]
  # rollout status、rollout undo 要看 ReplicaSet；看 Pod 狀態方便除錯
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch]
  # migration Job：建立與查看結果
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
