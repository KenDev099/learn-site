# 練習 2：k8s-12-ex2 的網路規則。先全部擋掉，再一條一條打開需要的連線
# 1. 預設拒絕：選到 namespace 裡的每個 Pod，進出兩個方向都隔離，而且沒有任何允許規則
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 3. cafe-api：只收 k8s-tools（代表 Gateway）來的 3000；只能連 postgres:5432 與 redis:6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cafe-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cafe-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-tools
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - { protocol: TCP, port: 6379 }
---
# 4. postgres 只收 cafe-api 的 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cafe-api
      ports:
        - { protocol: TCP, port: 5432 }
---
# 5. redis 只收 cafe-api 的 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cafe-api
      ports:
        - { protocol: TCP, port: 6379 }
