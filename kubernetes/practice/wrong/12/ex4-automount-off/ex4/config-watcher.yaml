# 練習 4（之二）：config-watcher 只能讀 cafe-flags 這一個 ConfigMap
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-cafe-flags
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cafe-flags]
    verbs: [get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-cafe-flags
subjects:
  - kind: ServiceAccount
    name: config-watcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-watcher
    spec:
      serviceAccountName: config-watcher
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      containers:
        - name: watcher
          image: curlimages/curl:8.23.0
          imagePullPolicy: IfNotPresent
          command: [sleep, infinity]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
