apiVersion: v1
kind: Pod
metadata:
  name: cafe-api-1
  labels:
    app.kubernetes.io/name: cafe-api
    app.kubernetes.io/instance: main
spec:
  containers:
    - name: api
      image: learn-k8s/cafe-api:v1
      imagePullPolicy: IfNotPresent
      env:
        - name: REQUIRE_DB
          value: "0"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

