# 練習 2：Argo CD 的 Application：把 config repo 的 charts/cafe 部署到 prod
# 這份檔案放在 config repo，由 Argo CD 讀取；不用在本機 kubectl apply
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cafe-prod
  namespace: argocd          # Application 物件本身放在 Argo CD 所在的 namespace
spec:
  project: cafe              # 平台團隊建立的 AppProject：限制這個團隊能部署到哪些 namespace
  source:
    repoURL: https://github.com/example-cafe/cafe-config
    path: charts/cafe
    targetRevision: release-2026.11.1   # 釘 tag：看得出 prod 跑哪一版，回滾就是改回上一個 tag
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc   # Argo CD 所在的叢集自己
    namespace: cafe-prod
  syncPolicy:
    automated:
      prune: true        # git 刪掉的資源，叢集也刪
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true   # 同步時也不要覆寫 replicas
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # 副本數由 HPA 決定
