# 練習 3：app repo（cafe-api）的發佈流程（GitOps）
#   build：建置並推送映像，tag 用這次的 commit SHA
#   bump-config：把 config repo 的 values-prod.yaml 的 image.tag 改成這次的 SHA，開 PR
# CI 不碰叢集：部署由叢集裡的 Argo CD 看到 PR 合併後自己同步
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write     # 只有這個 job 能推映像
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/example-cafe/cafe-api:${{ github.sha }}

  bump-config:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # GITHUB_TOKEN 只能動這個 repo；改 config repo 要另一把只對它有權限的 token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: example-cafe/cafe-config
          token: ${{ secrets.GITHUB_TOKEN }}
          path: config
      - name: 把 prod 的 image.tag 換成這次的 SHA
        env:
          TAG: ${{ github.sha }}
        run: yq -i '.image.tag = strenv(TAG)' config/charts/cafe/values-prod.yaml
      - name: 開 PR
        working-directory: config
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          git config user.name "cafe-release-bot"
          git config user.email "cafe-release-bot@users.noreply.github.com"
          git switch -c "release/$TAG"
          git commit -am "cafe-api: prod 換成 $TAG"
          git push origin "release/$TAG"
          gh pr create --base main --title "cafe-api: prod 換成 $TAG" --body "由 cafe-api 的 release workflow 產生"
