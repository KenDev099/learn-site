apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
images:
  - name: learn-k8s/cafe-api
    newTag: v2
configMapGenerator:
  - name: cafe-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=info
patches:
  - path: deployment-patch.yaml
