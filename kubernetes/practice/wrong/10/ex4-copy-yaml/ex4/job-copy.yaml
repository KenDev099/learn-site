apiVersion: batch/v1
kind: Job
metadata:
  generateName: daily-report-copy-
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daily-report
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          command:
            - psql
          args:
            - $(DATABASE_URL)
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /report/report.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-report
                  key: DATABASE_URL
          volumeMounts:
            - name: sql
              mountPath: /report
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sql
          configMap:
            name: daily-report-sql
