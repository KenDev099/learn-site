# 練習 2：cafe-hash 的 GET /hash 在併發時很慢。映像是 distroless（沒有 shell），
# 執行環境的設定寫在映像的 ENV 裡，這個檔案看不到。
# inspect.sh 查到映像裡 UV_THREADPOOL_SIZE=1：pbkdf2 只有一條執行緒在算，其他請求全部排隊
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-hash
  labels:
    app: cafe-hash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-hash
  template:
    metadata:
      labels:
        app: cafe-hash
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
            - name: UV_THREADPOOL_SIZE   # Pod 的 env 會蓋過映像的 ENV
              value: "4"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-hash
spec:
  selector:
    app: cafe-hash
  ports:
    - port: 80
      targetPort: 3000
