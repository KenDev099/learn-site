# 練習 2：cafe-hash 的 GET /hash 在併發時很慢。映像是 distroless（沒有 shell），
# 執行環境的設定寫在映像的 ENV 裡，這個檔案看不到。
# TODO：先寫好 inspect.sh 找出映像裡的 UV_THREADPOOL_SIZE 與 NODE_OPTIONS，再在下面用 env 把 UV_THREADPOOL_SIZE 改成 "4"
# 不要換映像：查問題時換掉映像，就不是在查原本那個東西了
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-hash
  labels:
    app: cafe-hash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-hash
  template:
    metadata:
      labels:
        app: cafe-hash
    spec:
      containers:
        - name: api
          image: learn-k8s/cafe-hash:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REQUIRE_DB
              value: "0"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-hash
spec:
  selector:
    app: cafe-hash
  ports:
    - port: 80
      targetPort: 3000
