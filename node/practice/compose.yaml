# 第 20、22、24、26 課用的 PostgreSQL。在 learn/node/practice 執行：docker compose up -d --wait
# 資料放在 tmpfs（記憶體）：docker compose down 再 up 就是全新的資料庫
name: learn-node
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: learn-node-postgres
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: coffee
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d coffee"]
      interval: 2s
      retries: 15
