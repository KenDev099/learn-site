# 課程用的 PostgreSQL、Redis 與 Mailpit（第 12 課從零說明）。在這個資料夾執行：docker compose up -d --wait
# 只綁 127.0.0.1；5433、6380 是為了不跟電腦上已經裝好的 PostgreSQL（5432）、Redis（6379）衝突
name: learn-nestjs
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: learn-nestjs-postgres
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 起的映像：掛在 /var/lib/postgresql，不是 /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.3-alpine
    container_name: learn-nestjs-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # 作品專案課（portfolio）用的收信工具：程式寄的信都收在這裡，不會真的寄出。網頁與 API 在 http://localhost:8026，SMTP 在 127.0.0.1:1026
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: learn-nestjs-mailpit
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
volumes:
  pgdata:
    name: learn-nestjs-pgdata
