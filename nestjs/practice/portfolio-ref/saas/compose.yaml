# 開發：npm run dev:up（db、redis、mailpit），API 用 npm run start:dev
# 類正式：docker compose --profile app up -d --build（db、redis 健康 → migrate 跑完 → api）
name: my-saas
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: my_saas
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d my_saas"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8027:8025"
      - "127.0.0.1:1027:1025"
  # migration 用擁有者帳號、一次性；api 只拿 pf_app 的連線字串
  # 用 build stage（有 devDependencies 裡的 prisma CLI）；最後的映像只有正式依賴，裡面沒有 prisma 指令（第 17 課）
  migrate:
    profiles: [app]
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://owner:owner@db:5432/my_saas
    depends_on:
      db:
        condition: service_healthy
  api:
    profiles: [app]
    build: .
    environment:
      NODE_ENV: production
      PORT: "3100"
      APP_DATABASE_URL: postgresql://pf_app:pf_app@db:5432/my_saas
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: my-saas
      JWT_SECRET: compose-only-secret-change-me-0123456789
      JWT_ISSUER: https://api.my-saas.example
      JWT_AUDIENCE: https://api.my-saas.example
      APP_URL: http://localhost:5173
      SMTP_URL: smtp://mailpit:1025
      STORAGE_DIR: /tmp/storage
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3101:3100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
