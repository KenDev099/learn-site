name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: my_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.10.3-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://owner:owner@localhost:5432/my_saas
      APP_DATABASE_URL: postgresql://pf_app:pf_app@localhost:5432/my_saas
      REDIS_URL: redis://localhost:6379/0
      REDIS_PREFIX: ci
      JWT_SECRET: ci-only-secret-0123456789abcdef0123
      JWT_ISSUER: https://api.my-saas.example
      JWT_AUDIENCE: https://api.my-saas.example
      APP_URL: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      STORAGE_DIR: ./storage
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      - run: docker build -t my-saas:latest .
