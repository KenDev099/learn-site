# 開發：docker compose up -d --wait db（只開資料庫，API 用 npm run start:dev）
# 類正式：docker compose --profile app up -d --build（db → migrate 跑完 → api）
name: event-signup
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: event_signup
    ports:
      - "127.0.0.1:5434:5432"   # 只綁本機；5434 避開本機的 5432 與 learn 的 5433
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_signup"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: [app]
    build:
      context: .
      target: build
    # 錯誤：api 每次啟動都先跑 migration，3 個副本會同時改 schema
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://app:app@db:5432/event_signup
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
