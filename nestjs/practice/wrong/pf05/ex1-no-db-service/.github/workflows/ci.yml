name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 錯誤：沒有資料庫服務，E2E 連不到 PostgreSQL
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/event_signup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
      - run: docker build -t event-signup:${{ github.sha }} .
