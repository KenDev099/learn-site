# 開發用的 PostgreSQL。在專案根目錄執行：docker compose up -d --wait
# 只綁 127.0.0.1；用 5436 是為了不跟電腦上其他的 PostgreSQL（5432、NestJS 課的 5433）衝突
name: learn-delivery
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: learn-delivery-postgres
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 起的映像：掛在 /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
    name: learn-delivery-pgdata
