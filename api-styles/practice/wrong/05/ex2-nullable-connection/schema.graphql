# 練習 2：把 Customer.orders 改成 Relay 的 Connection 分頁
# 要有：OrderConnection（edges、pageInfo）、OrderEdge（cursor、node）、PageInfo（hasNextPage、endCursor）
# Customer.orders 的參數：first（預設 10）、after（上一頁的 endCursor，可以不給）

type Customer {
  id: ID!
  name: String!
  "依下單時間由新到舊；first 是 1–50，after 是上一頁的 pageInfo.endCursor"
  orders(first: Int = 10, after: String): OrderConnection
}

type Order {
  id: ID!
  orderedAt: String!
  total: Int!
}

type OrderConnection {
  edges: [OrderEdge]
  pageInfo: PageInfo!
}

type OrderEdge {
  "這一筆的位置；當成下一次請求的 after 就會從它之後開始"
  cursor: String!
  node: Order!
}

type PageInfo {
  hasNextPage: Boolean!
  "最後一筆的游標；這一頁沒有資料時是 null"
  endCursor: String
}

type Query {
  customer(id: ID!): Customer
}
