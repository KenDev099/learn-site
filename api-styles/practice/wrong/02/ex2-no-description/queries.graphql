query MenuNames {
  menu {
    name
    price
  }
}

query ProductById($id: ID!) {
  product(id: $id) {
    id
    name
    price
  }
}

query CompareTwo($a: ID!, $b: ID!) {
  first: product(id: $a) {
    ...ProductCard
  }
  second: product(id: $b) {
    ...ProductCard
  }
}

fragment ProductCard on Product {
  id
  name
  price
}
