# 練習 1：「我的訂單」畫面要的資料
query OrderHistory($customerId: ID!, $first: Int) {
  customer(id: $customerId) {
    id
    name
    orders(first: $first) {
      edges {
        cursor
        node {
          id
          orderedAt
          total
          status
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
