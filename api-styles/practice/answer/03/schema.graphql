# 咖啡店的 schema。練習 1、2 不用改這個檔；練習 3 在這裡加上下單的 input、union 與 Mutation

enum Category {
  COFFEE
  TEA
  FOOD
}

type Product {
  id: ID!
  name: String!
  price: Int!
  category: Category!
  description: String
}

type Customer {
  id: ID!
  name: String!
}

type OrderItem {
  product: Product
  quantity: Int!
  unitPrice: Int!
}

type Order {
  id: ID!
  orderedAt: String!
  customer: Customer
  items: [OrderItem!]!
  total: Int!
}

type Query {
  order(id: ID!): Order
  orders: [Order!]!
  "目前登入的顧客；沒登入時是 null"
  me: Customer
  "目前登入顧客的訂單；沒登入時是空陣列"
  myOrders: [Order!]!
}

input OrderLineInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  items: [OrderLineInput!]!
}

type OrderPlaced {
  order: Order!
}

type OutOfStock {
  productId: ID!
  available: Int!
}

type InvalidQuantity {
  productId: ID!
  quantity: Int!
}

union PlaceOrderResult = OrderPlaced | OutOfStock | InvalidQuantity

type Mutation {
  placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
}
