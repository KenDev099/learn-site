// 練習 1：庫存服務的訊息。照課程頁的需求修改，改完在 learn/ 執行 node check.mjs api-styles 08
syntax = "proto3";

package coffee.inventory.v1;

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_COFFEE = 1;
  CATEGORY_TEA = 2;
  CATEGORY_FOOD = 3;
}

message Product {
  string id = 1;
  string name = 2;
  Category category = 3;
  int32 price_twd = 4;
}

message StockLevel {
  string product_id = 1;
  int32 available = 2;
  optional int32 reorder_point = 3;
}

message GetStockRequest {
  repeated string product_ids = 1;
}

message GetStockResponse {
  map<string, StockLevel> levels = 1;
}
