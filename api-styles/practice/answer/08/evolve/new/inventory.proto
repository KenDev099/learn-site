// 練習 3：下一版。照課程頁的需求修改，只能用相容的方式
syntax = "proto3";

package coffee.inventory.v1;

message Product {
  reserved 3;
  reserved "price_twd";
  string id = 1;
  string name = 2;
}

message StockLevel {
  string product_id = 1;
  // 改用 on_hand；過渡期伺服器兩個都填，確認沒有 client 讀 available 之後再刪（刪的時候 reserved）
  int32 available = 2 [deprecated = true];
  int32 on_hand = 3;
  string warehouse_id = 4;
}
