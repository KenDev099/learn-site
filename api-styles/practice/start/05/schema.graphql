# 練習 2：把 Customer.orders 改成 Relay 的 Connection 分頁
# 要有：OrderConnection（edges、pageInfo）、OrderEdge（cursor、node）、PageInfo（hasNextPage、endCursor）
# Customer.orders 的參數：first（預設 10）、after（上一頁的 endCursor，可以不給）

type Customer {
  id: ID!
  name: String!
  "✗ 一次回傳這位顧客的全部訂單：老顧客有幾千張時，一次全查出來"
  orders: [Order!]!
}

type Order {
  id: ID!
  orderedAt: String!
  total: Int!
}

type Query {
  customer(id: ID!): Customer
}
