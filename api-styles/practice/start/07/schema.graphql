# 第 7 課的咖啡店 schema（不用改）。codegen 從這份檔案產生型別，server.ts 也用它
enum OrderStatus {
  PREPARING
  READY
  PICKED_UP
}

type Product {
  id: ID!
  name: String!
  price: Int!
}

type Customer {
  id: ID!
  name: String!
  "新的在前；first 預設 10、最多 50"
  orders(first: Int = 10, after: String): OrderConnection!
}

type OrderConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  cursor: String!
  node: Order!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Order {
  id: ID!
  orderedAt: String!
  total: Int!
  status: OrderStatus!
}

input OrderLineInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  customerId: ID!
  lines: [OrderLineInput!]!
}

type Query {
  menu: [Product!]!
  "目前登入的顧客（x-customer-id 標頭），沒登入是 null"
  me: Customer
  customer(id: ID!): Customer
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): Order!
  updateOrderStatus(id: ID!, status: OrderStatus!): Order
  updatePrice(productId: ID!, price: Int!): Product
}
