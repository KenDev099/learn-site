syntax = "proto3";

package coffee.inventory.v1;

// 庫存服務：訂單服務、BFF 都透過它查庫存、扣庫存
service InventoryService {
  // unary：一個請求、一個回應
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  // server streaming：一個請求，伺服器陸續送多個回應
  rpc WatchStock(WatchStockRequest) returns (stream WatchStockResponse);
  // client streaming：客戶端陸續送多個請求，伺服器最後回一個回應
  rpc Restock(stream RestockRequest) returns (RestockResponse);
}

message StockLevel {
  string product_id = 1;
  int32 available = 2;
}

message GetStockRequest {
  repeated string product_ids = 1;
}

message GetStockResponse {
  map<string, StockLevel> levels = 1;
}

message ReserveRequest {
  string product_id = 1;
  int32 quantity = 2;
  // 同一個 key 重送時只扣一次（第 12 課實作）
  string idempotency_key = 3;
}

message ReserveResponse {
  string product_id = 1;
  int32 remaining = 2;
}

message WatchStockRequest {
  string product_id = 1;
}

message WatchStockResponse {
  string product_id = 1;
  int32 available = 2;
}

message RestockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message RestockResponse {
  int32 received_items = 1;
  int32 total_quantity = 2;
}
