# 練習 1：下一版的 schema。需求：
# 1. Product.price 改名為 priceTwd（Int!）
# 2. Order.status 從 String 改成 enum OrderStatus（PREPARING、READY、PICKED_UP），新欄位叫 state（OrderStatus!）
# 舊版 App 還在用 price 和 status：用不破壞它們的方式完成，resolver 寫在 resolvers.ts
type Product {
  id: ID!
  name: String!
  "價格（新台幣元）"
  price: Int!
}

type OrderItem {
  product: Product!
  quantity: Int!
}

type Order {
  id: ID!
  total: Int!
  "preparing、ready、picked_up 其中一個"
  status: String!
  items: [OrderItem!]!
}

type Query {
  menu: [Product!]!
  order(id: ID!): Order
}
