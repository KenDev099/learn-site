# 線上正在用的 v1 schema（不用改）。舊版 App 的查詢都照這份寫，練習 1 的測試拿它跟 evolve.graphql 比對
type Product {
  id: ID!
  name: String!
  "價格（新台幣元）"
  price: Int!
}

type OrderItem {
  product: Product!
  quantity: Int!
}

type Order {
  id: ID!
  total: Int!
  "preparing、ready、picked_up 其中一個"
  status: String!
  items: [OrderItem!]!
}

type Query {
  menu: [Product!]!
  order(id: ID!): Order
}
