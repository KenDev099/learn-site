# 練習 1 的 schema（不用改）：咖啡店的顧客、訂單、商品，彼此互相連通
type Query {
  "目前登入的顧客（沒登入或是店員時是 null）"
  me: Customer
  menu: [Product!]!
  product(id: ID!): Product
  "公開的顧客資料（例如評論區顯示名字）"
  customer(id: ID!): Customer
  order(id: ID!): Order
}

type Product {
  id: ID!
  name: String!
  price: Int!
  "買過這個商品的訂單（店員後台用）"
  orders: [Order!]!
}

type Customer {
  id: ID!
  name: String!
  "個資：只有店員看得到"
  email: String
  orders: [Order!]!
}

type Order {
  id: ID!
  total: Int!
  "店員之間的備註（例如「這位客人上次投訴過」）：只有店員看得到"
  internalNote: String
  customer: Customer!
  items: [OrderItem!]!
}

type OrderItem {
  quantity: Int!
  product: Product!
}
