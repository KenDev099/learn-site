// 這一頁範例用的訊息（不用改）。練習 1 要寫的是 ../../inventory/v1/inventory.proto
syntax = "proto3";

package coffee.demo.v1;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_READY = 2;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  int32 unit_price_twd = 3;
}

message Order {
  string id = 1;
  OrderStatus status = 2;
  repeated OrderItem items = 3;
  int32 total_twd = 4;
  optional int32 discount_twd = 5;
  map<string, string> notes = 6;
  google.protobuf.Timestamp ordered_at = 7;
  oneof pickup {
    int32 table_no = 8;
    string takeaway_name = 9;
  }
  int64 loyalty_points = 10;
}
