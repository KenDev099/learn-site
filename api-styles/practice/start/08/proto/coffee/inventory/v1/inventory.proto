// 練習 1：庫存服務的訊息。照課程頁的需求修改，改完在 learn/ 執行 node check.mjs api-styles 08
syntax = "proto3";

package coffee.inventory;

enum Category {
  COFFEE = 0;
  TEA = 1;
  FOOD = 2;
}

message Product {
  string id = 1;
  string name = 2;
  Category category = 3;
  float price = 4;
}

message StockLevel {
  string product_id = 1;
  int32 available = 2;
  int32 reorder_point = 3;
}

message GetStockRequest {
  string product_ids = 1;
}

