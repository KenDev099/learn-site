# 咖啡店的 schema（這一課不用改）

enum Category {
  COFFEE
  TEA
  FOOD
}

type Product {
  id: ID!
  name: String!
  price: Int!
  category: Category!
}

type Customer {
  id: ID!
  name: String!
}

type OrderItem {
  product: Product
  quantity: Int!
  unitPrice: Int!
}

type Order {
  id: ID!
  orderedAt: String!
  total: Int!
  customer: Customer
  "依 product_id 由小到大"
  items: [OrderItem!]!
}

type Query {
  "最近的 last 張訂單，新的在前"
  orders(last: Int!): [Order!]!
  product(id: ID!): Product
}

type Mutation {
  "改商品價格，回傳改好的商品；商品不存在時回 null"
  updatePrice(productId: ID!, price: Int!): Product
}
