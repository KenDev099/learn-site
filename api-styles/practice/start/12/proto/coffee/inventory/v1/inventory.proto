syntax = "proto3";

package coffee.inventory.v1;

// 庫存服務（期末專題版）：GraphQL 伺服器（BFF）透過它查庫存、預留庫存
service InventoryService {
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  // 一次預留一張訂單的所有品項：全部夠才扣，任何一項不夠就一項都不扣
  // 同一個 idempotency_key 重送時只扣一次，回傳第一次的結果
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
}

message StockLevel {
  string product_id = 1;
  int32 available = 2;
}

message GetStockRequest {
  repeated string product_ids = 1;
}

message GetStockResponse {
  map<string, StockLevel> levels = 1;
}

message ReserveItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveRequest {
  string idempotency_key = 1;
  repeated ReserveItem items = 2;
}

message ReserveResponse {
  // 扣完之後每個品項剩幾份
  repeated StockLevel remaining = 1;
}

// 庫存不夠時，FAILED_PRECONDITION 錯誤附帶的細節（error details）：哪個商品不夠、還剩幾份
message OutOfStockDetail {
  string product_id = 1;
  int32 available = 2;
}
