# App「我的訂單」畫面（不用改）：深度剛好 6（product 的 name 在第 6 層）
query OrderHistory($first: Int, $after: String) {
  me {
    id
    name
    orders(first: $first, after: $after) {
      edges {
        cursor
        node {
          id
          orderedAt
          total
          items {
            quantity
            product {
              name
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
