# App「下單」按鈕（不用改）。union 裡 App 還不認識的結果（例如之後新增的型別）只看得到 __typename，App 一律顯示「暫時無法下單」
mutation PlaceOrder($input: PlaceOrderInput!) {
  placeOrder(input: $input) {
    __typename
    ... on OrderPlaced {
      order {
        id
        total
      }
    }
    ... on OutOfStock {
      productId
      available
    }
  }
}
