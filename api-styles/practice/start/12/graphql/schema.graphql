# 咖啡店 App 的 GraphQL schema。練習 3 要在這裡加上 InventoryUnavailable 與 InventoryFailure
enum Category {
  COFFEE
  TEA
  FOOD
}

type Product {
  id: ID!
  name: String!
  price: Int!
  category: Category!
  "買過這個商品的訂單，新的在前（店員看全部；顧客只看得到自己的；沒登入是空陣列）"
  orders(first: Int = 10): [Order!]!
}

"菜單上的一項：商品加上庫存"
type MenuItem {
  product: Product!
  "還剩幾份；庫存服務查不到時是 null，errors 會有 INVENTORY_UNAVAILABLE"
  available: Int
}

type Customer {
  id: ID!
  name: String!
  "個資：只有店員看得到，其他人拿到 null"
  email: String
  "新的在前；first 預設 10、最多 50。只有本人和店員看得到，其他人拿到空的 connection"
  orders(first: Int = 10, after: String): OrderConnection!
}

type OrderConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  cursor: String!
  node: Order!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Order {
  id: ID!
  orderedAt: String!
  total: Int!
  "店員之間的備註：只有店員看得到"
  internalNote: String
  customer: Customer!
  items: [OrderItem!]!
}

type OrderItem {
  product: Product!
  quantity: Int!
  unitPrice: Int!
}

input OrderLineInput {
  productId: ID!
  quantity: Int!
}

input PlaceOrderInput {
  "App 產生的唯一編號（例如 UUID）：同一筆下單重送時帶同一個值，只會建立一張訂單"
  clientOrderId: ID!
  lines: [OrderLineInput!]!
}

type OrderPlaced {
  order: Order!
}

type OutOfStock {
  productId: ID!
  available: Int!
}

type InvalidQuantity {
  productId: ID!
  quantity: Int!
}

union PlaceOrderResult = OrderPlaced | OutOfStock | InvalidQuantity

type Query {
  menuWithStock: [MenuItem!]!
  "目前登入的顧客（沒登入或是店員時是 null）"
  me: Customer
  "公開的顧客資料（名字）；email 與訂單受授權規則保護"
  customer(id: ID!): Customer
  order(id: ID!): Order
}

type Mutation {
  "只有登入的顧客可以下單"
  placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
}
