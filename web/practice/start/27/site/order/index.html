<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上點餐、到店取餐｜豆留咖啡</title>
<link rel="canonical" href="https://brew.example.tw/order/">
<link rel="stylesheet" href="/style.css">

</head>
<body>
<header>
  <p><a href="/">豆留咖啡</a></p>
  <nav aria-label="主選單"><ul><li><a href="/menu/">菜單</a></li><li><a href="/stores/">門市</a></li><li><a href="/order/">線上點餐</a></li></ul></nav>
</header>
<main>
<h1>線上點餐</h1>
<div class="products">
  <section aria-labelledby="p-americano">
    <h2 id="p-americano">美式咖啡</h2>
    <p>80 元，大杯加 20 元</p>
    <fieldset>
      <legend>杯型</legend>
      <label><input type="radio" name="size-americano" value="中杯" checked> 中杯</label>
      <label><input type="radio" name="size-americano" value="大杯"> 大杯</label>
    </fieldset>
    <button type="button" class="add-to-cart" data-item="美式咖啡">加入購物車</button>
  </section>
  <section aria-labelledby="p-latte">
    <h2 id="p-latte">拿鐵</h2>
    <p>110 元，大杯加 20 元</p>
    <fieldset>
      <legend>杯型</legend>
      <label><input type="radio" name="size-latte" value="中杯" checked> 中杯</label>
      <label><input type="radio" name="size-latte" value="大杯"> 大杯</label>
    </fieldset>
    <button type="button" class="add-to-cart" data-item="拿鐵">加入購物車</button>
  </section>
  <section aria-labelledby="p-cappuccino">
    <h2 id="p-cappuccino">卡布奇諾</h2>
    <p>110 元，大杯加 20 元</p>
    <fieldset>
      <legend>杯型</legend>
      <label><input type="radio" name="size-cappuccino" value="中杯" checked> 中杯</label>
      <label><input type="radio" name="size-cappuccino" value="大杯"> 大杯</label>
    </fieldset>
    <button type="button" class="add-to-cart" data-item="卡布奇諾">加入購物車</button>
  </section>
</div>
<p role="status" class="cart">購物車：<span class="cart-count">0</span> 件</p>
<p><a href="/checkout/">前往結帳</a></p>
</main>
<footer><p>豆留咖啡 · 台北市大安區復興南路一段 100 號</p></footer>
<script src="/app.js" defer></script>
</body>
</html>
