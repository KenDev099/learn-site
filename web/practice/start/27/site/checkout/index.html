<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結帳｜豆留咖啡</title>
<link rel="canonical" href="https://brew.example.tw/checkout/">
<link rel="stylesheet" href="/style.css">
<meta name="robots" content="noindex">
</head>
<body>
<header>
  <p><a href="/">豆留咖啡</a></p>
  <nav aria-label="主選單"><ul><li><a href="/menu/">菜單</a></li><li><a href="/stores/">門市</a></li><li><a href="/order/">線上點餐</a></li></ul></nav>
</header>
<main>
<h1>結帳</h1>
<h2>你的訂單</h2>
<ul class="summary"></ul>
<form class="checkout">
  <label for="name">姓名</label>
  <input id="name" name="name" type="text" autocomplete="name" required>
  <label for="phone">電話</label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" required>
  <p><button type="submit">送出訂單</button></p>
</form>
<p role="status" class="result"></p>
</main>
<footer><p>豆留咖啡 · 台北市大安區復興南路一段 100 號</p></footer>
<script src="/app.js" defer></script>
</body>
</html>
