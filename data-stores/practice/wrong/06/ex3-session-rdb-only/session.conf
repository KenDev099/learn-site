# 練習 3：放 session 與限流計數的 Redis（測試會用 redis:8.10.3-alpine 執行 redis-server /conf/redis.conf）
# 下面兩行讓容器外連得進來：port 只發布到 127.0.0.1，正式環境不要這樣設。不要改
bind 0.0.0.0
protected-mode no

# session 不能被悄悄淘汰：滿了就讓寫入失敗（要有告警），重啟後要讀得回來
maxmemory 32mb
maxmemory-policy noeviction
appendonly no
# 不寫 save：沿用預設的 RDB 規則（3600 1 300 100 60 10000），當備份與快速重啟用
