# 資料儲存課的服務。在 learn/data-stores/practice 執行，一次只開這一課要用的：
#   docker compose --profile redis up -d --wait      第 2～6 課
#   docker compose --profile mongo up -d --wait      第 7～9 課
#   docker compose --profile search up -d --wait     第 10、11 課（第 11 課再加 --profile pg）
#   docker compose --profile s3 up -d --wait         第 12 課（再加 --profile pg）
#   期末專題：docker compose --profile pg --profile redis --profile search --profile s3 up -d --wait
# 關掉：docker compose --profile '*' stop；連資料一起刪：docker compose --profile '*' down -v
# port 只綁 127.0.0.1，用 164xx 避開電腦上原本的 PostgreSQL（5432）、Redis（6379）等
name: learn-data-stores
services:
  postgres:
    profiles: [pg]
    image: postgres:18.6-alpine
    container_name: learn-data-stores-postgres
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: coffee
    ports:
      - "127.0.0.1:16432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 起的映像掛在 /var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d coffee"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    profiles: [redis]
    image: redis:8.10.3-alpine
    container_name: learn-data-stores-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16479:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    profiles: [mongo]
    image: mongo:9.0.4-resolute
    container_name: learn-data-stores-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:16417:27017"
    volumes:
      - mongodata:/data/db
    mem_limit: 768m
    # 交易需要 replica set：第一次健康檢查時把自己設成單節點的 rs0，之後只回報狀態
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  elasticsearch:
    profiles: [search]
    image: elasticsearch:9.5.5
    container_name: learn-data-stores-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # 只限本機練習；正式環境一定要開
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:16492:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  garage:
    profiles: [s3]
    image: dxflrs/garage:v2.5.0
    container_name: learn-data-stores-garage
    # --single-node：自動設好單節點 layout；--default-access-key：用下面的環境變數建立開發用金鑰
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK6c6561726e2d64732d6b65792d303031
      GARAGE_DEFAULT_SECRET_KEY: 6c6561726e2d646174612d73746f7265732d6465762d7365637265742d303031
    ports:
      - "127.0.0.1:16490:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
    name: learn-data-stores-pgdata
  mongodata:
    name: learn-data-stores-mongodata
  esdata:
    name: learn-data-stores-esdata
  garagedata:
    name: learn-data-stores-garagedata
