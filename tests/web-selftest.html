<head>
<meta charset="utf-8">

<body data-lesson="1">
<header><h1>web.js helper 自我檢查（tests/pages.mjs 用）</h1></header>
<main>
<div class="exercise web">
  <p>練習 1：helpers</p>
  <script type="start-html"><p>x</p></script>
  <script type="answer-html"><header><h1>咖啡</h1><nav aria-label="主選單"><a href="/menu/">菜單</a></nav></header>
<main><section><h2>s</h2><button class="b">點餐</button><input id="q"><label for="q">搜尋</label>
<span class="vh">隱藏</span><span class="off">off</span><span class="same">same</span>
<img id="i" alt="" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" srcset="a.jpg 480w, b.jpg 960w, c.jpg 1440w" sizes="(min-width: 700px) 50vw, 100vw">
<div class="wide">wide</div><div class="scroller"><div class="inner">in</div></div>
<a href="#" tabindex="2">first</a>
</section><article><header>ah</header></article></main></script>
  <script type="answer-css">
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap }
.off { position: absolute; left: -9999px }
.same { color: #fff; background: #fff }
.wide { width: 500px }
@media (min-width: 600px) { .wide { width: auto } }
.scroller { overflow: auto } .inner { width: 2000px }
.b { outline: none; transition: box-shadow 1s }
.b:focus-visible { box-shadow: 0 0 0 3px #336791 }
.b:hover { color: red }
@media (prefers-color-scheme: dark) { body { background: rgb(0, 0, 0) } }
@layer base { h1 { margin: 0 !important; & span { color: blue } } }
</script>
  <script type="tests">
test('preview / overflow', async () => {
  await preview(320)
  assert.equal(win.innerWidth, 320, 'innerWidth')
  assert(overflowX() > 0, 'wide overflows at 320')
  assert.deepEqual(overflowing().map(e => e.className), ['wide'], 'overflowing names .wide only (scroller clips)')
  await preview(768)
  assert.equal(overflowX(), 0, 'no overflow at 768')
})
test('visible', async () => {
  await preview(1280)
  assert(visible($('h1')!), 'h1 visible')
  assert(!visible($('.vh')!), 'vh hidden')
  assert(!visible($('.off')!), 'off hidden')
  assert(!visible($('.same')!), 'same color hidden')
})
test('a11y names', () => {
  assert.equal(accName($('button')!), '點餐')
  assert.equal(accName($('#q')!), '搜尋')
  assert.equal(role($('body > header')!), 'banner')
  assert.equal(role($('article header')!), 'generic')
  assert.equal(role($('section')!), 'generic')
  assert.equal(role($('nav')!), 'navigation')
})
test('tab order', () => {
  const t = tabOrder().map(e => e.textContent || e.id)
  assert.deepEqual(t, ['first', '菜單', '點餐', 'q'])
})
test('focus ring', () => {
  const r = focusRing($('button')!)
  assert(r.changed, 'ring changed ' + JSON.stringify(r))
  assert.equal(doc.activeElement, $('button'))
})
test('contrast', () => {
  assert.equal(Math.round(contrast('#000', '#fff')), 21)
  assert.deepEqual(toRgb('oklch(1 0 0)').slice(0, 3), [255, 255, 255])
  assert.equal(textColors($('h1')!).background, 'rgba(0, 0, 0, 0)' === '' ? '' : textColors($('h1')!).background)
})
test('css rules', () => {
  const rs = cssRules()
  const h = rs.find(r => r.selector === 'h1')!
  assert.equal(h.layer, 'base')
  assert(h.props['margin-top'].important, 'important')
  assert(rs.some(r => r.selector === 'h1 span'), 'nested ' + rs.map(r => r.selector).join('|'))
  assert(rs.some(r => r.media.includes('@media (min-width: 600px)')), 'media')
  assert(ruleTree().length >= 5, 'tree')
})
test('emulate', async () => {
  await emulate({ colorScheme: 'dark', forceStates: true })
  await preview(1280)
  assert.equal(style(doc.body, 'background-color'), 'rgb(0, 0, 0)', 'dark')
  $('button')!.setAttribute('data-force-hover', '')
  assert.equal(style($('button')!, 'color'), 'rgb(255, 0, 0)', 'hover')
  await emulate({ colorScheme: 'light' })
  assert.notEqual(style(doc.body, 'background-color'), 'rgb(0, 0, 0)', 'light')
  await emulate({})
})
test('srcset', async () => {
  await atWidths([320, 1280], w => {
    const s = sizesAt($('#i') as HTMLImageElement)
    assert.equal(s, w >= 700 ? w / 2 : w, 'sizes')
  })
  await preview(1280)
  assert.equal(pickSrc($('#i') as HTMLImageElement, 1), 'b.jpg')
  assert.equal(pickSrc($('#i') as HTMLImageElement, 2), 'c.jpg')
  await preview(320)
  assert.equal(pickSrc($('#i') as HTMLImageElement, 1), 'a.jpg')
})
test('trees', () => {
  assert.deepEqual(sourceTree().slice(0, 3), [['header', 0], ['h1', 1], ['nav', 1]])
  assert.deepEqual(sourceTree(), domTree())
  assert.equal(sourceDoc().querySelector('h1')!.textContent, '咖啡')
  assert.equal(head().lang, 'zh-Hant')
  assert.match(visibleText(), /咖啡/)
})
test('axe', async () => {
  await preview(1280)
  const r = await axe({ rules: ['image-alt', 'label', 'button-name'] })
  assert.deepEqual(r.violations, [], JSON.stringify(r.violations))
})
</script>
  <script type="wrong" data-name="axe catches">{"html": "<img src=\"data:image/gif;base64,R0lGODlhAQABAAAAACw=\"><button></button>"}</script>
</div>

<div class="exercise web" data-doc="full" data-edit="html" data-url="https://brew.example.tw/menu/">
  <p>練習 2：head</p>
  <script type="start-html"><html><head><title>x</title></head><body><p>a</p></body></html></script>
  <script type="answer-html"><!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>菜單｜豆留咖啡</title>
<meta name="description" content="d">
<link rel="canonical" href="../menu/">
<link rel="preload" href="/hero.jpg" as="image" fetchpriority="high">
<meta property="og:title" content="t">
<script type="application/ld+json">{"@type":"CafeOrCoffeeShop","name":"豆留咖啡"}<\/script>
<script src="/a.js" defer><\/script>
<script>parent.document.title = "HACKED"<\/script>
</head>
<body><p>a</p><img src="x.png" onerror="parent.document.title='HACKED'"></body></html></script>
  <script type="tests">
test('head', () => {
  const h = head()
  assert.equal(h.title, '菜單｜豆留咖啡')
  assert.deepEqual(h.canonical, ['https://brew.example.tw/menu/'])
  assert.equal(h.preloads[0].href, 'https://brew.example.tw/hero.jpg')
  assert.equal(h.og['og:title'], 't')
  assert.equal((h.jsonLd[0] as any).name, '豆留咖啡')
  assert.equal(sourceDoc().compatMode, 'CSS1Compat')
  assert.equal(sourceDoc().head.firstElementChild!.tagName, 'META')
  assert.notEqual(document.title, 'HACKED', 'script ran!')
})
</script>
  <script type="wrong" data-name="no doctype">{"html": "<html lang=zh-Hant><head><meta charset=utf-8><title>菜單｜豆留咖啡</title></head><body></body></html>"}</script>
</div>
