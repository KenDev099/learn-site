# 練習 2：流量入口。upstream api 在 active.conf（deploy.sh 會改寫它）

# 每個用戶端 IP 每秒 50 個請求；10m 大約記得 16 萬個 IPv4 位址（第 12 課）
limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;

# HTTP 只做一件事：轉到 HTTPS（測試環境的 HTTPS 在 18263）
server {
    listen 80;
    return 301 https://$host:18263$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS 只在 HTTPS 回應裡才有效；always 讓 4xx、5xx 也帶
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=perip burst=50 nodelay;
    limit_req_status 429;

    # 指標只給內部的 Prometheus 直接抓 api:3000/metrics，不對外
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502 http_503;   # POST 已經送出就不重送（沒有 non_idempotent）
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
