# 練習 2：類正式環境。啟動：sh up.sh；收掉：docker compose -f compose.prod.yaml down -v
# 映像由 .env 的 BLUE_IMAGE、GREEN_IMAGE 決定（up.sh 第一次建立，deploy.sh 之後更新）
name: ld-26

x-api: &api
  environment:
    DB_HOST: db
    DB_NAME: cafe
    DB_USER: cafe_app                                # 只能讀寫資料的帳號
    DB_PASSWORD_FILE: /run/secrets/app_password      # 密碼用檔案，不放環境變數
    REDIS_URL: redis://redis:6379
    DRAIN_MS: "6000"                                 # 比 nginx resolver 的 valid=5s 長：nginx 先把它從名單拿掉，它才關門
  secrets: [app_password]
  deploy:
    replicas: 2
    resources:
      limits: { memory: 256m }
  stop_grace_period: 15s                             # 排空 6 秒，加上手上的請求，15 秒內一定結束
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, migrator_password, app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:18265:5432"

  redis:
    image: redis:8.10.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 128m }
    logging: *logging
    restart: unless-stopped

  # 一次性：用有建表權限的 cafe_migrator 套用 migration，成功結束 api 才會啟動
  # 部署新版本時，deploy.sh 用 MIGRATE_IMAGE 指定新映像再跑一次
  migrate:
    image: ${MIGRATE_IMAGE:-${BLUE_IMAGE:?先執行 sh up.sh 建立 .env}}
    command: ["node", "dist/migrate.js"]
    environment:
      DB_HOST: db
      DB_NAME: cafe
      DB_USER: cafe_migrator
      DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [migrator_password]
    logging: *logging
    depends_on:
      db: { condition: service_healthy }

  api-blue:
    <<: *api
    image: ${BLUE_IMAGE:?先執行 sh up.sh 建立 .env}

  api-green:
    <<: *api
    image: ${GREEN_IMAGE:?先執行 sh up.sh 建立 .env}

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:18260:80"
      - "127.0.0.1:18263:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro                 # 整個資料夾：deploy.sh 改寫 active.conf 後 reload 就看得到
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 128m }
    logging: *logging
    restart: unless-stopped
    depends_on:
      api-blue: { condition: service_healthy }
      api-green: { condition: service_healthy }

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  migrator_password: { file: ./secrets/migrator_password.txt }
  app_password: { file: ./secrets/app_password.txt }

volumes:
  pgdata:
