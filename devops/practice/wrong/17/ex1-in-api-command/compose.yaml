# 練習 1 的標準答案：migration 是部署前的一次性步驟，用能改 schema 的帳號；api 只用資料權限的帳號
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres                # 超級使用者只拿來初始化，app 和 migration 都不用它
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASS:?先 export MIGRATOR_PASS=任意字串}
      APP_PASSWORD: ${APP_PASS:?先 export APP_PASS=任意字串}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # api 用 cafe_app：只能 SELECT／INSERT／UPDATE／DELETE，被 SQL injection 也刪不了表
  api:
    build: ./app
    image: learn-devops/cafe-api:17
    command: ["sh", "-c", "node dist/migrate.js && node dist/server.js"]
    environment:
      DATABASE_URL: postgres://cafe_app:${APP_PASS}@db:5432/cafe
      DEBUG_ENDPOINTS: "1"
    ports:
      - "127.0.0.1:18170:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
