# 練習 3：修好的版本
name: ld-10b

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
    # 資料庫不發布 port：api 在同一個網路裡用 db:5432 連。真的要用桌面工具看資料，用 docker compose exec db psql
    ports:
      - "127.0.0.1:18106:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging:
      driver: local

  api:
    build: ../app
    image: learn-devops/cafe-api:10
    environment:
      DATABASE_URL: postgres://cafe:${PGPASS}@db:5432/cafe
    ports:
      - "127.0.0.1:18102:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    logging:
      driver: local

volumes:
  pgdata:
