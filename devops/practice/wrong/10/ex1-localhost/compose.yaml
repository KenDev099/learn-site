# 咖啡店的 API 和資料庫。啟動：export PGPASS=任意字串，再 docker compose -p ld-10 up -d --wait --build
name: ld-10

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
    # 不寫 ports：只有同一個網路裡的服務連得到，主機和外面都連不到
    volumes:
      - pgdata:/var/lib/postgresql          # postgres 18 起掛這一層，不是 .../data
    healthcheck:
      # $$ 讓 Compose 留下一個 $，由容器裡的 shell 展開；-h 127.0.0.1 走 TCP，初始化時的暫時伺服器不算
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging:
      driver: local                          # 預設就會輪替：每檔 20MB、最多 5 個

  # 一次性服務：跑完 migration 就結束，不能重啟
  migrate:
    build: ./app
    image: learn-devops/cafe-api:10
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://cafe:${PGPASS}@db:5432/cafe
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./app
    image: learn-devops/cafe-api:10
    environment:
      DATABASE_URL: postgres://cafe:${PGPASS}@localhost:5432/cafe   # 用服務名稱 db，不是 localhost
    ports:
      - "127.0.0.1:18100:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
