# 練習 3：金絲雀分流。backends.conf 已經定義好 upstream blue（穩定版）與 green（新版）

# 用 cookie uid 算雜湊：同一個使用者每次都落在同一邊，不會這一頁新版、下一頁舊版
split_clients "${remote_addr}" $canary_pool {
    10%     green;
    *       blue;
}

# 測試人員帶 X-Canary: always 就強制走新版；其他請求照上面的比例
map $http_x_canary $pool {
    always  green;
    default $canary_pool;
}

server {
    listen 80;

    location / {
        # 變數的值剛好是 upstream 的名稱，nginx 會直接用那個 upstream
        proxy_pass http://$pool;
    }
}
