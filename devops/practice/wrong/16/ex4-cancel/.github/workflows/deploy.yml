# 練習 4：部署 workflow（push 到 main 或手動觸發）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設只能讀；需要更多權限的 job 自己加
permissions:
  contents: read

env:
  IMAGE: ghcr.io/cafe-shop/cafe-api

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write     # 只有這個 job 能推映像到 GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: 部署到 staging
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: echo "部署 $REF"   # 實際上是 SSH 到主機執行 deploy.sh "$REF"，或呼叫雲端的部署 API

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production   # 在 repo 設定裡加「必要審查者」，這裡會停下來等核准
    concurrency:
      group: deploy-production
      cancel-in-progress: true   # 部署做到一半不能被砍；後來的排隊等
    steps:
      - name: 部署到 production（跟 staging 同一個 digest）
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: echo "部署 $REF"
