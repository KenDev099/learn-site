# 錯誤寫法：用 ip_hash 加權重。同一個 IP 的請求全部落在同一台，權重沒有作用
upstream canary {
    ip_hash;
    server 127.0.0.1:8081 weight=9;
    server 127.0.0.1:8082 weight=1;
}
map $http_x_canary $pool {
    always  green;
    default canary;
}
server {
    listen 80;
    location / {
        proxy_pass http://$pool;
    }
}
