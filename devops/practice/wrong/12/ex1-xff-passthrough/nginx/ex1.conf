# 練習 1：反向代理與轉送標頭

server {
    listen 80;
    server_name localhost;

    location /api/ {
        # 有 URI（結尾的 /）：比對到的 /api/ 換成 /，/api/products → /products
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;                                   # 用戶端連的主機名稱，不是 api:3000
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;   # 直接轉送用戶端給的值
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    root /srv/static;

    # 雜湊檔名：內容一改檔名就變，可以放心快取一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 檔名固定：每次都要回伺服器確認，使用者才拿得到新版
    location / {
        add_header Cache-Control "no-cache";
    }
}
