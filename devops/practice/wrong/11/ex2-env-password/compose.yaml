# 同一個映像，部署時才給設定：
#   APP_ENV 決定載入哪一份 config/<環境>.env（沒給就停下來，不會默默變成別的環境）
#   LOG_LEVEL 可以在部署時臨時調整，沒給就是 info
#   密碼是檔案，掛在容器的 /run/secrets/db_password，不出現在任何環境變數裡
services:
  api:
    build: ./app
    image: learn-devops/cafe-api:11
    ports:
      - "127.0.0.1:18110:3000"
    env_file: config/${APP_ENV:?要指定 APP_ENV（staging 或 production）}.env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_USER: cafe
      DB_NAME: cafe
      DB_PASSWORD: cafe-dev-password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: cafe-dev-password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe"]
      interval: 2s
      timeout: 3s
      retries: 15

secrets:
  db_password:
    file: ./secrets/db_password.txt
