# 錯的：只看短視窗，幾分鐘的尖峰就把人叫醒
# 練習 1：SLO 燃燒率告警（SRE workbook 的多視窗多燃燒率）
# 門檻 = 燃燒率 × 允許的錯誤比例（1 − 0.999 = 0.001）；長視窗確認「真的燒了一陣子」，短視窗確認「現在還在燒」
groups:
  - name: cafe-api-slo-alerts
    rules:
      - alert: CafeApiErrorBudgetBurnFast
        expr: |
          job:slo_errors_per_request:ratio_rate5m{job="cafe-api"} > (14.4 * 0.001)
        labels:
          severity: page
        annotations:
          summary: "cafe-api 錯誤預算快速燃燒：1 小時錯誤比例 {{ $value | humanizePercentage }}，照這速度 2 天內用完 30 天的預算"
          runbook_url: https://runbooks.cafe.test/cafe-api/error-budget-burn
      - alert: CafeApiErrorBudgetBurnSlow
        expr: |
          job:slo_errors_per_request:ratio_rate30m{job="cafe-api"} > (6 * 0.001)
        labels:
          severity: page
        annotations:
          summary: "cafe-api 錯誤預算持續燃燒：6 小時錯誤比例 {{ $value | humanizePercentage }}，5 天內用完 30 天的預算"
          runbook_url: https://runbooks.cafe.test/cafe-api/error-budget-burn
      - alert: CafeApiErrorBudgetBurnTicket
        expr: |
          job:slo_errors_per_request:ratio_rate3d{job="cafe-api"} > (1 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate6h{job="cafe-api"} > (1 * 0.001)
        labels:
          severity: ticket
        annotations:
          summary: "cafe-api 3 天的錯誤比例超過 SLO 允許的 0.1%，上班時間排查"
          runbook_url: https://runbooks.cafe.test/cafe-api/error-budget-burn
