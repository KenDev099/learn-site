# 練習 2：PR 標題以 fix 開頭時自動加上 bug 標籤（安全的版本）
name: label

on:
  # 要替 fork 來的 PR 加標籤，需要可寫的 token，所以留著 pull_request_target，
  # 但絕不 checkout、執行 PR 的程式碼
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - name: 標題以 fix 開頭就加上 bug 標籤
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if printf '%s\n' "$TITLE" | grep -qiE '^fix'; then
            gh pr edit "$NUMBER" --add-label bug
          fi
