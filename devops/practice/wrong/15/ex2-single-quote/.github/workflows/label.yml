name: label
on:
  pull_request_target:
    types: [opened, edited, synchronize]
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 標題以 fix 開頭就加上 bug 標籤
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if echo '${{ github.event.pull_request.title }}' | grep -qiE '^fix'; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label bug
          fi
