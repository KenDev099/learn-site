# 練習 1：替每個服務設定會輪替的 log。三個服務都已經寫好，你只要加 logging
# 自己試：export PGPASS=任意字串
#         docker compose -p ld-21 up -d --wait
#         curl -X POST 'http://localhost:18210/debug/log-spam?mb=50'
#         docker inspect ld-21-api-1 --format '{{json .HostConfig.LogConfig}}'
# 收掉：docker compose -p ld-21 down -v
#
# 提示：三個服務要一樣的設定，可以用 YAML 的錨點（&）和別名（*）只寫一次，
# Compose 會忽略 x- 開頭的頂層鍵，適合放這種共用片段

services:
  api:
    image: node:24.22.2-alpine3.24
    command: ["node", "/srv/server.mjs"]
    environment:
      SERVICE: api
    volumes:
      - ./svc:/srv:ro
    ports:
      - "127.0.0.1:18210:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 1s

  kitchen:
    image: node:24.22.2-alpine3.24
    command: ["node", "/srv/server.mjs"]
    environment:
      SERVICE: kitchen
    volumes:
      - ./svc:/srv:ro

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cafe -d cafe"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
