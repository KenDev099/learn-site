# 練習 2：類正式環境（要求看課程頁的練習 2）。啟動：sh up.sh；收掉：docker compose -f compose.prod.yaml down -v
# 映像由 .env 的 BLUE_IMAGE、GREEN_IMAGE 決定（up.sh 第一次啟動時建立，deploy.sh 之後更新）
# db 已經寫好；你要補上 redis、migrate、api-blue、api-green、nginx
name: ld-26

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, migrator_password, app_password]   # db/01-roles.sql 用後兩個建帳號
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 512m }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    restart: unless-stopped
    # 不發布 port：只有同一個網路裡的服務連得到

  # redis：redis:8.10.3-alpine，加 healthcheck

  # migrate：一次性服務，image 用 ${MIGRATE_IMAGE:-${BLUE_IMAGE}}，command ["node", "dist/migrate.js"]，用 cafe_migrator 連線

  # api-blue、api-green：各 2 個副本，image 分別是 ${BLUE_IMAGE}、${GREEN_IMAGE}，用 cafe_app 連線

  # nginx：nginx:1.30.6-alpine，127.0.0.1:18260→80、127.0.0.1:18263→443，掛 ./nginx 與 ./certs

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  migrator_password: { file: ./secrets/migrator_password.txt }
  app_password: { file: ./secrets/app_password.txt }

volumes:
  pgdata:
