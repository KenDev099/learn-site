# 第 12 課：api（後端）＋ nginx（入口）。這個檔案不用改，要改的是 nginx/ex1.conf～ex3.conf
# 換題目：CONF=ex2.conf docker compose up -d --wait（沒寫 CONF 就是 ex1.conf）
# 收掉：docker compose down
name: ld-12

services:
  api:
    image: node:24.22.2-alpine3.24
    command: ["node", "/app/server.mjs"]
    user: node
    volumes:
      - ./api/server.mjs:/app/server.mjs:ro
    healthcheck:
      # alpine 映像內建 busybox 的 wget，比每次啟動一個 node 程序輕
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
      start_interval: 1s
    # 不發布 port：只有同一個網路裡的 nginx 連得到

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:18120:80"
      - "127.0.0.1:18121:443"
    volumes:
      - ./nginx/${CONF:-ex1.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./static:/srv/static:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
