# 練習 1：反向代理與轉送標頭。這個檔案會掛到容器的 /etc/nginx/conf.d/default.conf（在 http 區塊裡面）
# 要做到：
#   /api/ 開頭的請求轉給 api:3000，並去掉 /api 前綴（/api/products → /products）
#   轉送 Host（用戶端連的主機名稱）、X-Forwarded-For、X-Forwarded-Proto、X-Request-ID
#   /          回 /srv/static/index.html，Cache-Control: no-cache
#   /assets/   回 /srv/static/assets/ 裡的檔案，快取一年而且 immutable
# 試：docker compose up -d --wait，再 curl -i http://localhost:18120/api/products

server {
    listen 80;
    server_name localhost;

    # 在這裡寫 location
}
