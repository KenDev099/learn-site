# 練習 3：保護後端。用 CONF=ex3.conf docker compose up -d --wait
# 要做到：
#   只有 /api/uploads 接受最大 2MB 的請求內容，其他路徑維持預設的 1MB
#   /api/ 底下以「用戶端 IP」限流：每秒 5 個請求、burst 10、nodelay，被拒絕時回 429（不是預設的 503）

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:3000/;
    }
}
