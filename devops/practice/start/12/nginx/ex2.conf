# 練習 2：在 nginx 終結 TLS。先執行 sh make-certs.sh 產生 certs/，再用 CONF=ex2.conf docker compose up -d --wait
# 憑證掛在容器的 /etc/nginx/certs/（server.crt、server.key）
# 要做到：
#   443：HTTPS，只允許 TLS 1.2 與 1.3；/api/ 跟練習 1 一樣轉給 api，後端要看到 X-Forwarded-Proto: https
#        所有 HTTPS 回應（包含 404 這類錯誤）都帶 HSTS：Strict-Transport-Security: max-age=31536000
#   80：任何路徑都 301 到 https://localhost:18121，保留路徑與查詢字串，不帶 HSTS
#   （容器裡是 80／443，主機上是 18120／18121，所以轉址網址要寫主機上的 port）

server {
    listen 80;
    server_name localhost;

    # 練習 1 的轉送，還沒改成 HTTPS
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
