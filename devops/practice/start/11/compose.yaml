# 第 10 課的 cafe-api＋PostgreSQL。設定和密碼全部寫死在這裡
services:
  api:
    build: ./app
    image: learn-devops/cafe-api:11
    ports:
      - "127.0.0.1:18110:3000"
    environment:
      DB_HOST: db
      DB_USER: cafe
      DB_NAME: cafe
      DB_PASSWORD: cafe-dev-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: cafe-dev-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe"]
      interval: 2s
      timeout: 3s
      retries: 15
