# 練習 2：recording rule（要求看課程頁的練習 2）
# 三個規則都要依 route 分組，結果只留 route 這一個 label
#   route:http_requests:rate5m                   每秒請求數
#   route:http_errors:ratio_rate5m               5xx 佔全部請求的比例
#   route:http_request_duration_seconds:p95_5m   p95 耗時（秒）
