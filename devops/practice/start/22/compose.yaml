# 練習 4：被壓測的 cafe-api（這個檔案不用改）
# 啟動：docker compose up -d --wait            （連線池 5 條）
#       POOL_SIZE=1 docker compose up -d --wait（連線池改成 1 條）
# 看 USE 指標：curl -s localhost:18220/metrics
# 收掉：docker compose down
name: ld-22

services:
  api:
    image: node:24.22.2-alpine3.24
    container_name: ld-22-api
    working_dir: /app
    command: ["node", "server.ts"]
    volumes:
      - ./api:/app:ro
    environment:
      POOL_SIZE: ${POOL_SIZE:-5}
    ports:
      - "127.0.0.1:18220:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 1s
      timeout: 2s
      retries: 20
