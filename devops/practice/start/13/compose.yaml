# 第 13 課：nginx → 3 個 api 副本 → PostgreSQL、Redis。這個檔案不用改
# 啟動：docker compose up -d --wait --build
# 收掉：docker compose down -v
name: ld-13

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: cafe-dev-password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cafe -d cafe"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.10.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./app
    image: learn-devops/cafe-api:13
    deploy:
      replicas: 3          # 同一個映像跑 3 份；也可以用 docker compose up --scale api=N 臨時改
    environment:
      DATABASE_URL: postgres://cafe:cafe-dev-password@db:5432/cafe
      REDIS_URL: redis://redis:6379
      DRAIN_MS: "3000"
      DEBUG_ENDPOINTS: "1"
    stop_grace_period: 10s # docker stop 先送 SIGTERM，10 秒還沒結束就 SIGKILL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 不發布 port：副本只讓 nginx 連

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:18130:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
