# 練習 1：部署前先跑 migration，而且 migration 和 api 用不同的資料庫帳號。
# 自己試：export PGPASS=任意字串 MIGRATOR_PASS=任意字串 APP_PASS=任意字串
#         docker compose -p ld-17 up -d --wait --build
# 收掉：docker compose -p ld-17 down -v
#
# db 已經寫好：第一次啟動時 db/01-roles.sql 建立 cafe_migrator 和 cafe_app，再執行你寫的 db/02-grants.sql。
# 你要加兩個服務（規格看課程頁的練習 1）：
# - migrate：一次性服務，用 cafe_migrator 執行 node dist/migrate.js
# - api：用 cafe_app 連線，只發布在 127.0.0.1:18170，DEBUG_ENDPOINTS=1，migrate 成功結束後才啟動
# 兩個都從 ./app 建置，映像名稱 learn-devops/cafe-api:17

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres                # 超級使用者只拿來初始化，app 和 migration 都不用它
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASS:?先 export MIGRATOR_PASS=任意字串}
      APP_PASSWORD: ${APP_PASS:?先 export APP_PASS=任意字串}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
