# 看結果：docker compose -p ld-10 ps -a；收掉：docker compose -p ld-10 down（加 -v 會連資料一起刪）
#
# 規格（細節看課程頁的練習 1、2）：
# - db：postgres:18.6-alpine3.24，使用者與資料庫都叫 cafe，密碼用 ${PGPASS}
# - api：從 ./app 建置，容器內聽 3000
# - 練習 2：加上跑 node dist/migrate.js 的步驟

services:
  db:
    image: postgres:18.6-alpine3.24
