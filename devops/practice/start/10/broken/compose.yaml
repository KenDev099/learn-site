# 練習 3：同事留下的設定，docker compose -p ld-10b up -d --wait --build 起不來。
# 在這個資料夾裡執行（cd broken），密碼一樣從 PGPASS 帶入。
name: ld-10b

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: cafe
      POSTGRES_DB: cafe
      POSTGRES_PASSWORD: ${PGPASS:?先 export PGPASS=任意字串}
    # 方便用桌面的資料庫工具連進來看資料
    ports:
      - "127.0.0.1:18105:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging:
      driver: local

  api:
    build: ../app
    image: learn-devops/cafe-api:10
    environment:
      DATABASE_URL: postgres://cafe:${PGPASS}@localhost:5432/cafe
    ports:
      - "127.0.0.1:18102:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    logging:
      driver: local

volumes:
  pgdata:
