# 練習 3：這個 workflow 會過，但每個 PR 要等很久。改成要求的樣子（課程頁的練習 3）。
name: fast

on:
  pull_request:

permissions:
  contents: read

jobs:
  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24, 26]
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cafe:cafe@localhost:5432/cafe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run migrate
      - run: npm run test:integration
      - run: docker build -t "cafe-api:$GITHUB_SHA" .
