# 這一課的「正式」資料庫：咖啡店的 cafe。所有操作都透過 docker exec，不發布 port。
# 自己試：docker compose -p ld-24 up -d --wait
# 收掉：docker compose -p ld-24 down -v
# 這個檔不用改。

services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: ld-24-db
    environment:
      POSTGRES_PASSWORD: practice-only        # 練習用；正式環境用第 11 課的 secrets
      POSTGRES_DB: cafe
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cafe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
