# 練習 1：SLO 燃燒率告警（要求看課程頁的練習 1）
# SLO 99.9%：允許的錯誤比例是 0.001。slo-rules.yml 已經算好各時間窗的錯誤比例，可以直接用
#   CafeApiErrorBudgetBurnFast    14.4 倍，1h 與 5m，severity: page
#   CafeApiErrorBudgetBurnSlow    6 倍，6h 與 30m，severity: page
#   CafeApiErrorBudgetBurnTicket  1 倍，3d 與 6h，severity: ticket
# 每個告警的 annotations 要有 summary 與 runbook_url
# 自己檢查語法：docker run --rm -v "$PWD":/w:ro --entrypoint /bin/promtool prom/prometheus:v3.15.1 check rules /w/slo-rules.yml /w/alerts.yml
groups:
  - name: cafe-api-slo-alerts
    rules: []
