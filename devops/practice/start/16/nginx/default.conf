# 練習 2 的入口 nginx。這個檔案不用改
# 整個 nginx/ 資料夾掛到容器的 /etc/nginx/conf.d/，nginx 會載入裡面所有的 *.conf：
#   default.conf（這個檔）＋ active.conf（upstream api 指向目前作用中的顏色，由 deploy.sh／rollback.sh 改寫）
server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
