# 練習 3 的兩個假後端，跟分流設定跑在同一個 nginx 容器裡。這個檔案不用改
# blue = 目前的穩定版，green = 金絲雀（新版）；回應內容就是自己的顏色
server {
    listen 8081;
    location / { default_type text/plain; return 200 "blue\n"; }
}
server {
    listen 8082;
    location / { default_type text/plain; return 200 "green\n"; }
}

upstream blue  { server 127.0.0.1:8081; }
upstream green { server 127.0.0.1:8082; }
