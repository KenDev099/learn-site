# 練習 3：金絲雀分流。backends.conf 已經定義好 upstream blue（穩定版）與 green（新版）
# 要做到：
#   - 依 cookie uid 分流：約 10% 的使用者進 green、其餘進 blue；同一個 uid 每次都進同一邊
#   - 帶 X-Canary: always 標頭的請求一律進 green（讓測試人員強制走新版）
# 自己試：docker run --rm -d --name ld-16-canary -p 127.0.0.1:18162:80 -v "$PWD/canary:/etc/nginx/conf.d:ro" nginx:1.30.6-alpine
#         curl -b uid=u123 http://localhost:18162/；curl -H 'X-Canary: always' http://localhost:18162/
server {
    listen 80;

    location / {
        proxy_pass http://blue;
    }
}
